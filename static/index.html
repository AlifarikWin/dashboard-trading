<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Trading BEI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trading BEI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 12l4-4 3 3 6-7%22 stroke=%22%231fbf75%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<script src="vendor/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{--bg:#0e1318;--card:#161d24;--card2:#1c242d;--line:#26303b;--text:#e8eef4;--mute:#8a97a6;
  --green:#22c27b;--green-bg:rgba(34,194,123,.13);--red:#f25551;--red-bg:rgba(242,85,81,.13);
  --amber:#e9b440;--amber-bg:rgba(233,180,64,.13);--blue:#5aa2ff;--blue-bg:rgba(90,162,255,.13);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{padding:12px 14px calc(28px + env(safe-area-inset-bottom));transition:margin .2s ease}
/* header */
header{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--green)}
#mkt{margin-left:auto}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.iconbtn.on{border-color:var(--green);color:var(--green)}
/* sidebar */
.sb{position:fixed;top:0;bottom:0;left:0;width:248px;background:#11171d;border-right:1px solid var(--line);z-index:15;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease}
.sb.open{transform:none}
.sb .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:16px}
.sb .grp{font-size:11px;color:var(--mute);letter-spacing:.6px;text-transform:uppercase;padding:14px 18px 6px}
.sb button.it{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:1px 8px;padding:10px 12px;border:0;background:none;border-radius:10px;color:#c4ceda;font-size:14.5px;text-align:left}
.sb button.it svg{width:19px;height:19px;flex:none;opacity:.85}
.sb button.it:hover{background:var(--card)}
.sb button.it.on{background:var(--blue-bg);color:var(--blue)}
.sb .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.sb .scroller{overflow-y:auto;flex:1;padding-bottom:16px}
.sb-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:14}
.menubtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
@media (min-width:900px){
  .sb-bg{display:none!important}
  body.sb-pinned .wrap{margin-left:248px}
  body.sb-pinned .wrap{max-width:none;padding-left:28px;padding-right:28px}
  body.sb-pinned .inner{max-width:760px}
}
.inner{max-width:720px;margin:0 auto}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.h{font-size:13px;color:var(--mute);margin:16px 2px 8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}
.muted{color:var(--mute);font-size:13px}
.up{color:var(--green)}.down{color:var(--red)}.amber{color:var(--amber)}
.hide{display:none!important}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}
.t-amber{background:var(--amber-bg);color:var(--amber)}.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--mute)}
.btn{background:var(--blue);border:0;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{padding:7px 11px;font-size:13px;font-weight:500}
.btn.full{width:100%}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .span{grid-column:1/-1}
/* hero verdict */
.hero{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.hero.go{background:linear-gradient(135deg,rgba(34,194,123,.18),rgba(34,194,123,.04));border-color:rgba(34,194,123,.35)}
.hero.stop{background:linear-gradient(135deg,rgba(242,85,81,.18),rgba(242,85,81,.04));border-color:rgba(242,85,81,.35)}
.hero.wait{background:linear-gradient(135deg,rgba(233,180,64,.16),rgba(233,180,64,.03));border-color:rgba(233,180,64,.35)}
.hero .k{font-size:12px;color:var(--mute)}
.hero .v{font-size:22px;font-weight:800;margin:2px 0 6px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
/* status tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.tile .k{font-size:11px;color:var(--mute)}
.tile .v{font-weight:700;font-size:15px;margin-top:2px}
/* stock card */
.stock .top{display:flex;align-items:baseline;gap:8px}
.stock .code{font-weight:800;font-size:17px;letter-spacing:.3px}
.stock .px{margin-left:auto;font-family:var(--mono);font-size:16px}
.stock .chg{font-family:var(--mono);font-size:13px;min-width:58px;text-align:right}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.levels div{background:var(--card2);border-radius:10px;padding:7px 8px}
.levels span{display:block;font-size:11px;color:var(--mute)}
.levels b{font-family:var(--mono);font-size:14px;font-weight:600}
.scorebar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--blue)}
/* list rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .code{font-weight:700;min-width:54px}
.li .px{font-family:var(--mono);margin-left:auto}
.li .chg{font-family:var(--mono);font-size:13px;min-width:58px;text-align:right}
.li .chev{color:var(--mute)}
.clr{position:relative;display:block}.clr input{padding-right:38px}
.xbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--card2);color:var(--mute);font-size:16px;line-height:28px;padding:0;display:none}
.clr.has .xbtn{display:block}
.clr input[type=number]{-moz-appearance:textfield;appearance:textfield}
.clr input[type=number]::-webkit-inner-spin-button,.clr input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sugs{position:absolute;left:10px;right:10px;top:52px;z-index:30;background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sug{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--text)}
.sug:last-child{border-bottom:0}
.sug .nm,.mkn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute);font-size:13px}
.mkn{display:flex;flex-direction:column;min-width:0;gap:3px}
.mkn .tags{display:flex;gap:4px;flex-wrap:wrap}.mkn .tags .tag{font-size:10.5px;padding:1px 6px}
.fchips,.qchips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.qchips{margin:8px 0 0}
.fchip{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:6px 11px;font-size:12.5px}
.fchip.on{background:rgba(90,162,255,.16);border-color:rgba(90,162,255,.55);color:var(--text)}
.sum{margin-top:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;background:var(--card2)}
.sum.good{border-left:3px solid var(--green)}.sum.bad{border-left:3px solid var(--red)}.sum.warn{border-left:3px solid var(--amber)}
.lv4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lb span{font-size:12px;color:var(--mute)}.lb b{font-family:var(--mono);font-size:15px}.lb i{font-style:normal;font-size:11.5px;color:var(--mute)}
.lb.g{border-left:3px solid var(--green)}.lb.r{border-left:3px solid var(--red)}.lb.b{border-left:3px solid var(--blue)}.lb.o{border-left:3px solid #ff8a3d}
details.more summary{cursor:pointer;font-weight:650;list-style:none}details.more summary::after{content:" ▾";color:var(--mute)}details.more[open] summary::after{content:" ▴"}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--mute)}
.kpi b{font-family:var(--mono);font-size:18px}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{padding:5px 0 5px 24px;position:relative;font-size:14px;color:#cdd6df;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{position:absolute;left:2px;font-weight:800}
.checks .y::before{content:"✓";color:var(--green)}.checks .n::before{content:"✕";color:var(--red)}.checks .p::before{content:"•";color:var(--amber)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 10px}
.sheet p{color:#cdd6df;font-size:14px;margin:8px 0}
.step{display:flex;gap:10px;margin:10px 0;font-size:14px;color:#cdd6df}
.step b.n{background:var(--blue-bg);color:var(--blue);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24303c;border-radius:12px;padding:10px 14px;font-size:14px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:30}
.ti{background:none;border:0;color:var(--mute);padding:0 0 0 3px;font-size:12px;line-height:1;cursor:pointer;vertical-align:baseline}
.ti:hover{color:var(--blue)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flag{font-size:12px;border-radius:8px;padding:4px 8px;background:var(--amber-bg);color:var(--amber)}
.flag.block{background:var(--red-bg);color:var(--red)}
.news{padding:12px 14px;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.news a{color:var(--text);text-decoration:none;font-size:14.5px;line-height:1.4;display:block;margin:4px 0}
.news a:hover{text-decoration:underline}
.news .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.dot2{width:8px;height:8px;border-radius:50%;display:inline-block}
.tone-positif{background:var(--green)}.tone-negatif{background:var(--red)}.tone-netral{background:var(--mute)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 10px}
.toggle input{width:auto}
.tour-hl{position:fixed;z-index:40;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.72),0 0 0 2px var(--blue);pointer-events:none;transition:all .2s}
.tour-box{position:fixed;z-index:41;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tour-box p{margin:6px 0 12px;font-size:14.5px;color:#cdd6df}
.offline{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.zone{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.zone span{background:var(--card2);border-radius:8px;padding:4px 8px;color:#cdd6df}
.zone b{font-family:var(--mono);font-weight:600}
.lvl{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border-bottom:0}
.lvl .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800}
.lvl .t{font-size:13px;color:var(--mute)}
.lvl .v{font-family:var(--mono);font-size:17px;font-weight:700}
.lvl .d{font-size:13px;color:#cdd6df;margin-top:2px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.trow .n{color:var(--mute);font-size:12px}
.trow .val{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
#lwc{height:340px;border-radius:12px;overflow:hidden;background:var(--card)}
@media (max-width:420px){header h1{font-size:16px}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:8px 2px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.help-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.help-item:last-child{border-bottom:0}
.help-item .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;flex:none}
.help-item .ic svg{width:19px;height:19px}
.help-item b{display:block;margin-bottom:2px}
.help-item .when{font-size:12.5px;color:var(--amber);margin-top:4px}
@media (min-width:600px){.levels b{font-size:15px}}
</style>
</head>
<body>

e" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M8 9h8M8 13h6"/></svg><span>Jurnal</span></button><button class="it" data-p="calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 19h2M12 19h4"/></svg><span>Kalkulator</span></button><div class="grp">Analisis</div><button class="it" data-p="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span>Semua Saham</span></button><button class="it" data-p="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M17 4v16"/><rect x="4" y="8" width="6" height="7" rx="1"/><rect x="14" y="6" width="6" height="9" rx="1"/></svg><span>Analisis Saham</span></button><button class="it" data-p="stream"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="19" cy="12" r="2"/></svg><span>Stream Peristiwa</span></button><button class="it" data-p="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg><span>Track Record</span></button><button class="it" data-p="signals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg><span>Sinyal Watchlist</span></button><button class="it" data-p="radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg><span>Radar Swing</span></button><button class="it" data-p="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Hasil Uji Strategi</span></button><div class="grp">Bantuan</div><button class="it" data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Pengaturan</span></button><button class="it" data-p="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 013 3v13a2 2 0 00-2-2H2zM22 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/></svg><span>Panduan Harian</span></button><button class="it" data-p="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Fungsi Menu</span></button></div></aside><div class="sb-bg hide" id="sbBg"></div>

<script>
// ================= util =================
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const fmt = n => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 0});
const fmt1 = (n, d = 1) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("id-ID", {minimumFractionDigits: d, maximumFractionDigits: d});
const sign = n => n > 0 ? "+" : "";
const pct = (n, d = 2) => n == null || isNaN(n) ? "—" : sign(n) + fmt1(n, d) + "%";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const rp = n => n == null || isNaN(n) ? "—" : (n < 0 ? "−" : n > 0 ? "+" : "") + "Rp" + fmt(Math.abs(n));
const rpS = n => { if (n == null || isNaN(n)) return "—"; const a = Math.abs(n), s = n < 0 ? "−" : n > 0 ? "+" : "";
  return a >= 1e12 ? s + "Rp" + fmt1(a / 1e12) + " T" : a >= 1e9 ? s + "Rp" + fmt1(a / 1e9) + " M" : a >= 1e6 ? s + "Rp" + fmt1(a / 1e6) + " jt" : s + "Rp" + fmt(a); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let OFFLINE = false;
async function getJSON(p) {
  const r = await fetch(p + "?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error(p + ": " + r.status);
  if (r.headers.get("X-Offline")) OFFLINE = true; else if (p.includes("meta")) OFFLINE = false;
  return r.json();
}
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(e._h); e._h = setTimeout(() => e.classList.add("hide"), 5000); }
const tickOf = p => p < 200 ? 1 : p < 500 ? 2 : p < 2000 ? 5 : p < 5000 ? 10 : 25;
const roundDown = p => { const t = tickOf(p); const r = Math.floor(p / t) * t, t2 = tickOf(r); return t2 !== t ? Math.floor(r / t2) * t2 : r; };

// ================= glosarium istilah (tombol ⓘ) =================
const GLOSS = {
  ihsg: ["IHSG", "Indeks Harga Saham Gabungan: gambaran arah pasar secara umum. Saat IHSG turun, kebanyakan saham ikut tertekan, jadi dashboard menyarankan tidak membeli."],
  rem: ["Rem rugi", "Batas rugi per minggu (atur di Pengaturan) dan batas harian (jumlah transaksi & jumlah rugi). Jika tercapai, semua saran lot jadi 0 agar Anda berhenti sebelum rugi membesar."],
  uji: ["Uji strategi", "Aturan Daftar Pagi diuji otomatis di data lama lalu dibuktikan di data terbaru yang terpisah. Jika hasilnya merugi setelah fee, dashboard menyarankan tidak trading."],
  skor: ["Skor", "Nilai 0–100 dari: asing net buy, penutupan dekat harga tertinggi, lonjakan volume, tren, dan akumulasi. Bukan peluang naik dalam persen."],
  trigger: ["Beli ≥ (trigger)", "Harga pemicu Auto Buy. Order baru terkirim jika harga menembus angka ini, sehingga saham yang lemah sejak pagi tidak ikut terbeli."],
  sl: ["Stop loss (SL)", "Harga jual otomatis untuk membatasi rugi. Pasang sebagai Auto Sell Stop Loss di Stockbit segera setelah terbeli."],
  tp: ["Take profit (TP)", "Harga jual otomatis untuk mengambil untung."],
  lot: ["Lot", "1 lot = 100 lembar. Jumlah lot dihitung agar rugi saat kena stop loss sekitar 1% modal (atur di Pengaturan), lalu dikurangi bila ada kondisi waspada."],
  buy: ["Area beli", "Zona support terdekat: harga pernah berbalik naik di sini beberapa kali. Dihitung dari titik balik harga sebenarnya."],
  sell: ["Area jual", "Zona resistance terdekat: harga pernah tertahan turun di sini beberapa kali."],
  bo: ["Tembus ↑", "Jika harga DITUTUP di atas level ini dengan volume, peluang lanjut naik lebih besar. Tunggu penutupan, jangan bereaksi saat baru menyentuh."],
  bd: ["Jebol ↓", "Jika harga DITUTUP di bawah level ini, peluang lanjut turun lebih besar. Bagi pemegang saham, ini batas cut loss."],
  rsi: ["RSI 14", "Ukuran kecepatan naik/turun 14 hari (0–100). ≥70 jenuh beli (rawan koreksi), ≤30 jenuh jual."],
  atr: ["ATR", "Rata-rata rentang gerak harian. Dipakai untuk menentukan jarak stop loss yang wajar."],
  ma: ["MA (moving average)", "Rata-rata harga penutupan N hari. Harga di atas MA50 dan MA200 = tren naik."],
  weekly: ["Tren mingguan", "Arah harga di grafik mingguan. Sinyal beli harian yang melawan tren mingguan sering gagal, jadi tidak dijadikan BUY."],
  rs: ["Kekuatan vs IHSG", "Kenaikan saham dikurangi kenaikan IHSG pada periode yang sama. Positif = saham lebih kuat dari pasar."],
  sector: ["Sektor", "Rata-rata kenaikan saham sektor yang sama di watchlist, untuk melihat apakah sektornya sedang diminati."],
  ara: ["ARA / ARB", "Batas kenaikan (ARA) dan penurunan (ARB) harga dalam sehari yang ditetapkan BEI. Order di luar batas ini otomatis ditolak."],
  per: ["PER", "Harga dibagi laba per saham. Makin kecil, makin murah dibanding labanya (bandingkan dengan saham sejenis)."],
  pbv: ["PBV", "Harga dibagi nilai buku per saham. Di bawah 1 berarti harga di bawah nilai buku."],
  roe: ["ROE", "Laba bersih dibagi ekuitas: seberapa efisien perusahaan menghasilkan laba dari modal pemegang saham."],
  der: ["DER", "Utang dibagi ekuitas. Makin tinggi, makin besar risiko keuangannya (kecuali bank, yang memang berutang tinggi)."],
  graham: ["Nilai wajar Graham", "√(22,5 × EPS × nilai buku per saham). Rumus klasik untuk perkiraan kasar nilai wajar, bukan target harga."],
  winrate: ["Win rate", "Persentase transaksi yang untung setelah fee. Harus dibaca bersama besar untung rata-rata vs rugi rata-rata."],
  priced: ["Sudah dihargai pasar", "Harga sudah bergerak ≥5% sejak berita terbit. Membeli setelah lonjakan karena berita sering berakhir di pucuk (FOMO)."],
  patuh: ["Skor kepatuhan", "Persentase aturan rencana Daftar Pagi yang Anda jalankan: beli di rentang trigger–limit, lot sesuai saran, keluar di TP/SL/tutup sore, dan tanpa pelanggaran saat mencatat. Hanya untuk posisi yang dicatat lewat tombol \"Sudah beli\"."],
  bsjp: ["BSJP", "Beli Sore Jual Pagi: beli di sesi pra-penutupan (15.50–16.00) saham yang ditutup kuat dengan volume besar, lalu jual besok pagi saat pembukaan. Hanya dipakai jika uji 1 tahun dan 60 hari terakhir sama-sama positif setelah fee."],
  bep: ["Harga impas (BEP)", "Break-even point: harga jual terendah agar hasil penjualan setelah fee jual menutup modal beli plus fee beli. Dibulatkan ke atas sesuai fraksi harga BEI."],
  cum: ["Cum date & ex date", "Cum date = hari terakhir membeli saham agar berhak atas dividen. Ex date = hari berikutnya; pembeli di hari ini tidak mendapat dividen, sehingga harga biasanya turun kira-kira sebesar dividennya."],
  track: ["Track record", "Daftar Pagi disimpan sebelum hari perdagangan, lalu dinilai dengan harga sebenarnya hari itu. Ini bukti nyata, bukan simulasi masa lalu."],
};
const ti = k => GLOSS[k] ? `<button class="ti" data-term="${k}" aria-label="Penjelasan ${GLOSS[k][0]}">ⓘ</button>` : "";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-term]"); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  const [t, d] = GLOSS[b.dataset.term];
  sheet(`<h2>${t}</h2><p>${d}</p><button class="btn ghost full" data-close>Mengerti</button>`);
}, true);
const TECH_TERM = l => /^RSI/.test(l) ? "rsi" : /ATR|Volatil/.test(l) ? "atr" : /mingguan/.test(l) ? "weekly" : /IHSG/.test(l) ? "rs" : /^Sektor/.test(l) ? "sector"
  : /^MA|Jarak dari MA/.test(l) ? "ma" : /^PER/.test(l) ? "per" : /^PBV/.test(l) ? "pbv" : /^ROE/.test(l) ? "roe" : /DER/.test(l) ? "der" : /Graham/.test(l) ? "graham" : null;

// ================= state =================
let SIG = null, META = null, DT = null, CHECK = null, BT = null;
let alertsOn = store.get("alertsOn", false), prevSig = store.get("prevSignals", {}), alerted = new Set(store.get("posAlerted", []));
let nextAt = 0, timer = null, audio = null;

// ================= sheet =================
function sheet(html) { $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheetBg").classList.remove("hide"); document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheetBg").classList.add("hide"); $("#sheet").innerHTML = ""; document.body.style.overflow = ""; }
$("#sheetBg").onclick = e => { if (e.target.id === "sheetBg" || e.target.closest("[data-close]")) closeSheet(); };

// ================= navigasi (sidebar) =================
const TITLES = {calc: "Kalkulator", sesi: "Rekap Sesi", besok: "Kandidat Besok", movers: "Gerak Hari Ini", market: "Semua Saham", stream: "Stream Peristiwa", track: "Track Record", analysis: "Analisis Saham", today: "Hari Ini", pos: "Posisi Saya", check: "Cek Saham", jour: "Jurnal", signals: "Sinyal Watchlist",
  radar: "Radar Swing", bt: "Hasil Uji Strategi", set: "Pengaturan", guide: "Panduan Harian", help: "Fungsi Menu"};
const SUB = {calc: () => renderCalc(), sesi: () => renderSesi(), besok: () => renderBesok(), movers: () => renderMovers(), market: () => renderMarket(), stream: () => renderStream(), track: () => renderTrack(), analysis: () => renderAnalysis(), signals: () => renderSignals(), radar: () => renderRadar(), bt: () => renderBT(), set: () => renderSettings(), guide: () => renderGuide(), help: () => renderHelp()};
let page = "today";
const isDesk = () => window.matchMedia("(min-width:900px)").matches;
function setSidebar(open) {
  $("#sb").classList.toggle("open", open);
  $("#sbBg").classList.toggle("hide", !open || isDesk());
  document.body.classList.toggle("sb-pinned", open && isDesk());
  if (isDesk()) store.set("sbOpen", open);
}
$("#menuBtn").onclick = () => setSidebar(!$("#sb").classList.contains("open"));
$("#sbBg").onclick = () => setSidebar(false);
window.addEventListener("resize", () => setSidebar(isDesk() ? store.get("sbOpen", true) : false));
function go(p) {
  page = p;
  $$(".sb .it").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  $("#pageTitle").textContent = TITLES[p];
  const core = ["today", "pos", "check", "jour"].includes(p);
  $$("section[id^=p-]").forEach(s => s.classList.toggle("hide", s.id !== (core ? "p-" + p : "p-sub")));
  if (!core) SUB[p]();
  if (p === "check") initCheckSearch();
  if (!isDesk()) setSidebar(false);
  window.scrollTo(0, 0);
}
$$(".sb .it").forEach(b => b.onclick = () => go(b.dataset.p));
let anTicker = null;
function openAnalysis(t) { anTicker = t; closeSheet(); go("analysis"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-an]"); if (b) { e.stopPropagation(); openAnalysis(b.dataset.an); } });
function openSub(k) { go(k); }
document.addEventListener("click", e => { if (!e.target.closest(".sugs") && !e.target.closest("input")) $$(".sugs").forEach(s => s.classList.add("hide")); });
document.addEventListener("click", e => { const b = e.target.closest("[data-chk]"); if (!b) return;
  e.stopPropagation(); go("check"); $("#cTicker").value = b.dataset.chk; $("#cAvg").value = ""; $("#cGo").click(); });

// ================= pengaturan & risiko =================
function settings() {
  const r = (META && META.risk) || {capital_idr: 1e7, risk_per_trade_pct: 1, max_position_pct: 25, fee_buy_pct: .15, fee_sell_pct: .25};
  const s = store.get("settings", {});
  return {cap: s.cap ?? r.capital_idr, risk: s.risk ?? r.risk_per_trade_pct, maxPos: s.maxPos ?? r.max_position_pct, week: s.week ?? 3,
    maxTrades: s.maxTrades ?? 3, maxLoss: s.maxLoss ?? 2, feeB: r.fee_buy_pct, feeS: r.fee_sell_pct};
}
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function daily() {  // batas harian: jumlah transaksi & rugi hari ini
  const s = settings(), t = todayStr();
  const opened = getPos().filter(p => (p.at || "").slice(0, 10) === t).length
    + getJ().filter(j => (j.openedAt || "").slice(0, 10) === t).length;
  const closedToday = getJ().filter(j => j.date === t);
  const losses = closedToday.filter(j => tradePL(j) < 0).length;
  const why = [];
  if (opened >= s.maxTrades) why.push(`sudah ${opened} transaksi hari ini (maks ${s.maxTrades})`);
  if (losses >= s.maxLoss) why.push(`sudah ${losses}× rugi hari ini (maks ${s.maxLoss})`);
  return {opened, losses, stop: why.length > 0, why};
}
const regime = () => (DT && DT.regime) || (SIG && SIG.regime) || {level: "unknown", status: "—"};
function lots(p, maxShare) {
  const s = settings(), lim = p.limit, sl = p.sl, per = (lim - sl) + lim * (s.feeB + s.feeS) / 100;
  if (per <= 0) return 0;
  return Math.max(0, Math.min(Math.floor(s.cap * s.risk / 100 / per / 100), Math.floor(s.cap * (maxShare ?? s.maxPos / 100) / (lim * 100))));
}
function adjLots(n) {  // pengaman: rem rugi, kondisi IHSG, hasil uji
  const r = regime(), t = DT && DT.tuning;
  if (brake().stop) return [0, "rem rugi aktif"];
  if (daily().stop) return [0, "batas harian tercapai"];
  if (r.level === "bad") return [0, "IHSG turun"];
  if (t && t.status === "tidak_layak") return [0, "uji strategi negatif"];
  let why = [];
  if (r.level === "warn") { n = Math.floor(n / 2); why.push("IHSG waspada"); }
  if (t && t.status === "data_kurang") { n = Math.floor(n / 2); why.push("uji belum cukup"); }
  return [n, why.join(", ")];
}

const getJ = () => store.get("journal", []);
const tradePL = t => { const s = settings(); return (t.sell * (1 - s.feeS / 100) - t.buy * (1 + s.feeB / 100)) * t.lots * 100; };
function brake() {
  const s = settings(), d = new Date(), ws = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
  const pl = getJ().filter(t => new Date(t.date + "T00:00:00") >= ws).reduce((a, t) => a + tradePL(t), 0);
  const limit = s.cap * s.week / 100;
  return {pl, limit, stop: pl <= -limit};
}

function priceOf(code) {
  const s = SIG && SIG.signals.find(x => x.ticker === code);
  if (s) return {price: s.price, sig: s, zones: s.zones};
  const p = DT && DT.picks.find(x => x.code === code);
  if (p) return {price: p.live ? p.live.last : p.close, sig: null, zones: p.zones};
  const c = CHECK && CHECK.stocks[code];
  return c ? {price: c.price, sig: c.signal, zones: c.zones} : null;
}
function posStatus(p) {
  const q = priceOf(p.ticker);
  if (!q) return {label: "—", tag: "t-gray", note: "harga tidak tersedia", price: null};
  if (q.price <= p.sl) return {label: "JUAL", tag: "t-red", note: "kena stop loss", price: q.price};
  if (q.price >= p.tp) return {label: "JUAL", tag: "t-green", note: "take profit tercapai", price: q.price};
  if (q.sig && q.sig.signal === "SELL") return {label: "JUAL", tag: "t-red", note: (q.sig.reasons || [])[0] || "sinyal SELL", price: q.price};
  return {label: "TAHAN", tag: "t-blue", note: "di antara SL dan TP", price: q.price};
}

// tombol × untuk mengosongkan kolom isian (muncul hanya jika kolom berisi)
function addClear(inp, onClear) {
  if (!inp || inp.parentElement.classList.contains("clr")) return;
  const w = document.createElement("span"); w.className = "clr";
  inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
  const b = document.createElement("button"); b.type = "button"; b.className = "xbtn"; b.setAttribute("aria-label", "Kosongkan"); b.textContent = "×";
  w.appendChild(b);
  const sync = () => w.classList.toggle("has", !!inp.value);
  inp.addEventListener("input", sync); sync();
  b.onclick = e => { e.preventDefault(); e.stopPropagation(); inp.value = ""; sync(); inp.dispatchEvent(new Event("input")); if (onClear) onClear(); inp.focus(); };
}

function renderCalc() {
  const s = settings(), c = store.get("calc", {});
  $("#subBody").innerHTML = `<div class="card">
      <div class="fgrid">
        <div><label class="f">Harga beli (Rp)</label><input id="kB" type="number" inputmode="decimal" min="1" placeholder="mis. 1500" value="${c.b ?? ""}"></div>
        <div><label class="f">Harga jual (Rp)</label><input id="kS" type="number" inputmode="decimal" min="1" placeholder="mis. 1600" value="${c.s ?? ""}"></div>
        <div><label class="f">Jumlah lot</label><input id="kL" type="number" inputmode="numeric" min="1" step="1" placeholder="1 lot = 100 lembar" value="${c.l ?? ""}"></div>
        <div><label class="f">Fee beli / jual (%)</label><div class="row" style="gap:6px"><input id="kFB" type="number" step="0.01" min="0" value="${c.fb ?? s.feeB}"><input id="kFS" type="number" step="0.01" min="0" value="${c.fs ?? s.feeS}"></div></div>
      </div>
      <p class="muted" style="font-size:12px;margin:8px 0 0">Fee bawaan sesuai Pengaturan (Stockbit: beli 0,15%, jual 0,25% termasuk PPh 0,1%). Ubah jika broker Anda berbeda.</p>
      <div class="btns"><button class="btn ghost" id="kClear">Kosongkan isian</button><button class="btn ghost" id="kFee">Fee bawaan</button></div>
    </div>
    <div id="kOut"></div>`;
  const ceilTick = v => { const t = tickOf(v); return Math.ceil(v / t - 1e-9) * t; };  // toleransi pembulatan desimal
  const roundTick = v => { const t = tickOf(v); return Math.round(v / t) * t; };
  // jumlah tick antara dua harga, mengikuti pergantian fraksi harga (mis. dari Rp5 ke Rp10 di harga 2.000)
  const ticks = (a, z) => { let lo = Math.min(a, z), hi = Math.max(a, z), n = 0; while (lo < hi && n < 100000) { lo += tickOf(lo); n++; } return n; };
  const calc = (b, sp, l, fb, fs) => {
    const nb = b * l * 100, cb = nb * fb / 100, tb = nb + cb, ns = sp * l * 100, cs = ns * fs / 100, ts = ns - cs, pl = ts - tb;
    return {nb, cb, tb, ns, cs, ts, pl, pp: pl / tb * 100};
  };
  const paint = () => {
    const b = +$("#kB").value, sp = +$("#kS").value, l = Math.floor(+$("#kL").value), fb = +$("#kFB").value, fs = +$("#kFS").value;
    store.set("calc", {b: $("#kB").value, s: $("#kS").value, l: $("#kL").value, fb: $("#kFB").value, fs: $("#kFS").value});
    if (!(b > 0) || !(l >= 1) || !(fb >= 0) || !(fs >= 0) || fs >= 100) {
      $("#kOut").innerHTML = `<div class="empty">Isi harga beli dan jumlah lot. Harga jual boleh diisi untuk melihat untung/rugi.</div>`;
      return;
    }
    const warn = [];
    if (b % tickOf(b)) warn.push(`Harga beli ${fmt(b)} tidak sesuai fraksi harga (kelipatan Rp${tickOf(b)}).`);
    if (sp > 0 && sp % tickOf(sp)) warn.push(`Harga jual ${fmt(sp)} tidak sesuai fraksi harga (kelipatan Rp${tickOf(sp)}).`);
    const bepRaw = b * (1 + fb / 100) / (1 - fs / 100), bep = ceilTick(bepRaw);
    const rp = v => (v < 0 ? "−Rp" : "Rp") + fmt(Math.round(Math.abs(v)));
    let res = "";
    if (sp > 0) {
      const r = calc(b, sp, l, fb, fs), good = r.pl > 0;
      res = `<div class="card" style="border-left:4px solid var(--${good ? "green" : r.pl < 0 ? "red" : "line"})">
        <div class="muted" style="font-size:13px">${good ? "Untung" : r.pl < 0 ? "Rugi" : "Impas"} bersih</div>
        <div style="font-family:var(--mono);font-size:28px;font-weight:700" class="${cls(r.pl)}">${r.pl > 0 ? "+" : ""}${rp(r.pl)}</div>
        <div class="${cls(r.pp)}" style="font-family:var(--mono)">${pct(r.pp)} dari modal</div>
        <div style="margin-top:10px">
          <div class="trow"><div>Nilai beli<div class="n">${fmt(b)} × ${fmt(l)} lot × 100 lembar</div></div><div class="val">${rp(r.nb)}</div></div>
          <div class="trow"><div>Fee beli (${fmt1(fb, 2)}%)</div><div class="val">${rp(r.cb)}</div></div>
          <div class="trow"><div><b>Total modal keluar</b></div><div class="val"><b>${rp(r.tb)}</b></div></div>
          <div class="trow"><div>Nilai jual<div class="n">${fmt(sp)} × ${fmt(l)} lot × 100 lembar</div></div><div class="val">${rp(r.ns)}</div></div>
          <div class="trow"><div>Fee jual (${fmt1(fs, 2)}%)</div><div class="val">−${rp(r.cs)}</div></div>
          <div class="trow"><div><b>Uang diterima</b></div><div class="val"><b>${rp(r.ts)}</b></div></div>
          <div class="trow"><div>Perubahan harga</div><div class="val ${cls(sp - b)}">${pct((sp / b - 1) * 100)} · ${sp - b >= 0 ? "+" : "−"}${ticks(b, sp)} tick</div></div>
        </div></div>`;
    }
    const sc = [-5, -2, null, 2, 3, 5, 10].map(x => x === null ? {lbl: "Impas (BEP)", p: bep} : {lbl: `${x > 0 ? "+" : ""}${x}%`, p: x > 0 ? ceilTick(b * (1 + x / 100)) : roundTick(b * (1 + x / 100))});
    $("#kOut").innerHTML = (warn.length ? `<div class="card" style="border-left:4px solid var(--amber)">${warn.map(esc).join("<br>")}</div>` : "") + res + `
      <div class="card"><div class="trow" style="border:0;padding-top:0"><div><b>Harga impas (BEP)</b>${ti("bep")}<div class="n">Harga jual minimal agar tidak rugi setelah fee</div></div><div class="val"><b>${fmt(bep)}</b></div></div>
        <div class="n" style="padding-bottom:6px">Naik ${pct((bep / b - 1) * 100)} (${ticks(b, bep)} tick) dari harga beli.</div></div>
      <div class="h">Simulasi harga jual</div>
      <div class="card scroll" style="padding:6px 12px"><table><tr><th>Skenario</th><th>Harga jual</th><th>Untung/rugi</th><th>%</th></tr>
        ${sc.map(x => { const r = calc(b, x.p, l, fb, fs); return `<tr><td style="font-family:inherit">${x.lbl}</td><td>${fmt(x.p)}</td><td class="${cls(r.pl)}">${r.pl > 0 ? "+" : ""}${rp(r.pl)}</td><td class="${cls(r.pp)}">${pct(r.pp)}</td></tr>`; }).join("")}
      </table></div>
      <p class="muted" style="font-size:12.5px">Harga skenario dibulatkan ke fraksi harga BEI. Perhitungan tidak memasukkan batas ARA/ARB harian.</p>`;
  };
  ["#kB", "#kS", "#kL", "#kFB", "#kFS"].forEach(id => $(id).addEventListener("input", paint));
  ["#kB", "#kS", "#kL"].forEach(id => addClear($(id)));
  $("#kClear").onclick = () => { ["#kB", "#kS", "#kL"].forEach(id => { $(id).value = ""; $(id).dispatchEvent(new Event("input")); }); $("#kB").focus(); };
  $("#kFee").onclick = () => { $("#kFB").value = s.feeB; $("#kFS").value = s.feeS; paint(); toast("Fee dikembalikan ke Pengaturan."); };
  paint();
}

function s2TestHtml(t) {
  if (!t || !t.matched) return `<p class="muted" style="font-size:12.5px;margin:6px 0 0">Uji syarat "naik di sesi 2" untuk BSJP dijalankan seminggu sekali setelah bursa tutup (data per jam 1 tahun).</p>`;
  const P = t.pos || {}, N = t.neg || {};

    <div class="trow"><div>Turun/datar di sesi 2<div class="n">${N.n || 0} transaksi · ${N.gap_up_pct ?? "—"}% dibuka naik besok</div></div><div class="val ${cls(N.avg_net)}">${N.n ? pct(N.avg_net) : "—"}</div></div>

async function renderSesi() {
  const body = $("#subBody");

  try { R = await getJSON("data/sesi.json"); } catch (e) { body.innerHTML = `<div class="empty">Data belum tersedia.</div>`; return; }

    return;
  }
  const tab = SS.tab && R[SS.tab] ? SS.tab : (R.s2 ? "s2" : "s1"), S = R[tab], key = tab === "s1" ? "ch" : "s2";
  const dl = R.delay_min ? ` (harga tertunda ±${R.delay_min} menit)` : "";
  const note = tab === "s1"
    ? {berlangsung: `Sesi 1 sedang berlangsung · data ${esc(S.time)}${dl}. Perubahan sejak penutupan kemarin.`,

  const sec = S.sectors || [];
  body.innerHTML = `<div class="seg">${[["s1", "Sesi 1"], ["s2", "Sesi 2"]].map(([k, l]) => `<button data-sst="${k}" class="${tab === k ? "on" : ""}" ${R[k] ? "" : "disabled style=\"opacity:.4\""}>${l}</button>`).join("")}</div>
    <p class="muted" style="font-size:13px;margin:0 2px 10px">${note}</p>
    <div class="kpis"><div class="kpi"><span>IHSG ${tab === "s1" ? "sesi 1" : "sesi 2"}</span><b class="${cls(S.ihsg)}">${S.ihsg != null ? pct(S.ihsg) : "—"}</b></div>
      <div class="kpi"><span>Saham naik · turun</span><b style="white-space:nowrap"><i class="up" style="font-style:normal">${S.breadth.up}↑</i> · <i class="down" style="font-style:normal">${S.breadth.down}↓</i></b></div></div>
    ${tab === "s1" && S.picks && Object.keys(S.picks).length ? `<div class="card" style="padding:10px 14px"><b>Daftar Pagi (status terkini)</b>
      <div class="reasons" style="margin-top:6px">${Object.entries(S.picks).map(([k, v]) => `<span class="tag ${/TP/.test(k) ? "t-green" : /SL/.test(k) ? "t-red" : /berjalan/.test(k) ? "t-blue" : "t-gray"}">${v} ${esc(k)}</span>`).join("")}</div></div>` : ""}
    ${sec.length ? `<div class="card" style="padding:4px 14px"><div class="trow" style="border:0"><b>Sektor</b><span class="muted" style="font-size:12px">median, saham likuid</span></div>
      ${[...sec.slice(0, 3), ...(sec.length > 6 ? sec.slice(-3) : sec.slice(3))].map(r => `<div class="trow"><div>${esc(r.s)}<div class="n">${r.up} naik · ${r.down} turun</div></div><div class="val ${cls(r.med)}">${pct(r.med)}</div></div>`).join("")}</div>` : ""}
    <div class="seg" style="margin-top:4px">${[["up", tab === "s1" ? "Naik" : "Menguat"], ["down", tab === "s1" ? "Turun" : "Tergerus"]].map(([k, l]) => `<button data-ssd="${k}" class="${SS.dir === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <div class="fchips"><button class="fchip ${SS.good ? "on" : ""}" data-ssf="good">Tren harian bagus saja</button><button class="fchip ${SS.liq ? "on" : ""}" data-ssf="liq">Likuid ≥ Rp10 M/hari</button></div>
    <div id="ssList"></div>
    ${tab === "s2" ? `<div class="card"><b>Sesi 2 untuk BSJP</b>${ti("bsjp")}${s2TestHtml(B && B.stats && B.stats.s2)}</div>` : ""}`;
  const paint = () => {
    let L = S.items.filter(x => !x.blk && (!SS.good || x.tr === "up") && (!SS.liq || (x.v20 || 0) >= 10) && (SS.dir === "up" ? x[key] > 0 : x[key] < 0));

    const tags = x => [tab === "s2" && x.s1 != null ? `<span class="tag t-gray">sesi 1 ${pct(x.s1, 1)}</span>` : "",
      tab === "s2" ? `<span class="tag t-gray">hari ini ${pct(x.ch, 1)}</span>` : "",
      ...(x.warn || []).map(w => `<span class="tag ${w === "ARB" ? "t-red" : "t-amber"}">${w === "sudah naik tinggi" ? "jangan kejar" : w}</span>`)].join("");
    $("#ssList").innerHTML = `<div class="muted" style="font-size:12.5px;margin:0 2px 6px">${fmt(L.length)} saham</div>` + (L.length
      ? `<div class="list">${L.slice(0, SS.n).map(x => `<button class="li" data-mk="${x.c}"><span class="code">${x.c}</span>
          <span class="grow mkn"><span class="nm">${esc(x.n)}</span><span class="tags">${tags(x)}</span></span>
          <span class="px">${fmt(x.p)}</span><span class="chg ${cls(x[key])}">${pct(x[key])}</span></button>`).join("")}</div>
        ${L.length > SS.n ? `<button class="btn ghost full" id="ssMore" style="margin-bottom:10px">Tampilkan ${Math.min(30, L.length - SS.n)} lagi</button>` : ""}`
      : `<div class="empty">Tidak ada saham yang memenuhi saringan ini.</div>`);
    const mb = $("#ssMore"); if (mb) mb.onclick = () => { SS.n += 30; paint(); };

  };
  $$("[data-sst]").forEach(b => b.onclick = () => { if (!R[b.dataset.sst]) return; SS.tab = b.dataset.sst; SS.n = 30; renderSesi(); });
  $$("[data-ssd]").forEach(b => b.onclick = () => { SS.dir = b.dataset.ssd; SS.n = 30; $$("[data-ssd]").forEach(x => x.classList.toggle("on", x === b)); paint(); });
  $$("[data-ssf]").forEach(b => b.onclick = () => { const k = b.dataset.ssf; SS[k] = !SS[k]; store.set(k === "good" ? "ssGood" : "ssLiq", SS[k]); b.classList.toggle("on", SS[k]); SS.n = 30; paint(); });
  paint();
}

// ================= KANDIDAT BESOK: BSJP + Day Trade =================
let BS_TAB = "up";
const BS_STATUS = {layak: ["LAYAK", "up"], tidak_layak: ["BELUM TERBUKTI", "down"], data_kurang: ["DATA KURANG", "amber"]};
function bsLots(price, status) {
  const s = settings();
  if (status !== "layak") return [0, "uji historis BSJP belum positif"];
  if (brake().stop) return [0, "rem rugi aktif"];
  if (daily().stop) return [0, "batas harian tercapai"];
  const byRisk = Math.floor(s.cap * s.risk / 100 / (price * 0.03 * 100));
  const byCap = Math.floor(s.cap * s.maxPos / 100 / (price * 100));
  return [Math.max(0, Math.min(byRisk, byCap)), ""];
}
function bsCard(x, status, mode) {
  const [lt, why] = bsLots(x.plan ? x.plan.buy_limit : x.price, status), m = x.mon;
  const mon = m ? `<div class="sum ${m.status === "gap naik, bertahan" ? "good" : m.status === "dibuka turun" ? "bad" : "warn"}">Pagi ini: <b>${esc(m.status)}</b> · buka ${pct(m.gap)} · sekarang ${pct(m.now)} dari harga beli</div>`
    : mode === "pagi" ? `<div class="sum warn">Belum ada transaksi pagi ini.</div>` : "";
  return `<div class="card stock"><div class="top"><span class="code">${x.c}</span><span class="muted grow" style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n || "")}</span>
      <span class="px">${fmt(x.price)}</span><span class="chg ${cls(x.chg)}">${pct(x.chg)}</span></div>
    <div class="reasons" style="margin-top:6px"><span class="tag t-green">tutup di ${Math.round(x.cpos * 100)}% rentang harian</span>
      <span class="tag t-blue">volume ${fmt1(x.vr)}×</span>${x.brk ? `<span class="tag t-blue">tembus high 20 hari</span>` : ""}
      ${x.s2 != null ? `<span class="tag ${x.s2 > 0 ? "t-green" : "t-amber"}">sesi 2 ${pct(x.s2, 1)}</span>` : ""}<span class="tag t-gray">skor ${x.score ?? "—"}</span></div>
    ${mon}
    ${x.plan && mode !== "pagi" ? `<div class="kpis" style="margin:10px 0 0">
      <div class="kpi"><span>Beli 15.50–16.00</span><b>≤ ${fmt(x.plan.buy_limit)}</b></div>
      <div class="kpi"><span>Lot</span><b>${lt}</b></div></div>
      ${why ? `<p class="muted" style="font-size:12.5px;margin:6px 0 0">Lot 0: ${esc(why)}.</p>` : ""}` : ""}
    <div class="btns"><button class="btn ghost sm" data-an="${x.c}">Analisis</button>${x.plan && mode === "sore" && lt ? `<button class="btn ghost sm" data-bsbuy="${x.c}|${x.plan.buy_limit}|${lt}">Sudah beli</button>` : ""}</div></div>`;
}
async function renderBesok() {

  const tun = DT && DT.tuning, dtTest = tun && tun.test, dtAvg = dtTest && dtTest.avg_pct;
  const bsAvg = U.n ? U.avg_net : null;

  if (tun && tun.status === "layak") ok.push(["Day Trade", dtAvg]);
  ok.sort((a, b) => b[1] - a[1]);
  const verdict = ok.length ? `Prioritaskan <b>${ok[0][0]}</b>: hasil ujinya paling baik setelah fee.`

      if (pv.s2_filter) head += ` Syarat tambahan: naik di sesi 2 dibanding akhir sesi 1.`;
      if (pv.s2_missing) head += ` Harga akhir sesi 1 hari ini tidak tersimpan, jadi syarat sesi 2 tidak bisa diterapkan.`;

    <div class="seg">${[["up", "BSJP naik"], ["down", "Potensi turun"], ["dt", "Day Trade"]].map(([k, l]) => `<button data-bst="${k}" class="${BS_TAB === k ? "on" : ""}">${l}</button>`).join("")}</div>
    <p class="muted" style="font-size:13px;margin:0 2px 10px">${head}</p>
    ${list}
    ${BS_TAB === "up" ? `<div class="h">Bukti BSJP</div>
    <div class="card" style="padding:4px 14px">
      <div class="trow"><div>Uji 1 tahun (5 teratas/hari)<div class="n">${U.n || 0} transaksi · ${U.gap_up_pct ?? "—"}% dibuka lebih tinggi</div></div><div class="val ${cls(U.avg_net)}">${U.n ? pct(U.avg_net) : "—"}</div></div>

let MV = {tab: "up", good: store.get("mvGood", true), liq: store.get("mvLiq", true), risk: false, n: 50};
const MVT = {
  up: ["Naik", x => x.ch > 0, (a, b) => b.ch - a.ch],
  down: ["Turun", x => x.ch < 0, (a, b) => a.ch - b.ch],
  vol: ["Volume ramai", x => x.rv != null && x.rv >= 1.5, (a, b) => b.rv - a.rv],
  gap: ["Gap naik & bertahan", x => x.gap != null && x.gap > 0 && x.hold, (a, b) => b.gap - a.gap],

let UNI = null;
async function loadUni() {
  if (!UNI) { try { UNI = await getJSON("data/universe.json"); } catch (e) { UNI = {rows: [], div: {}}; } }
  return UNI;
}
const uniRow = c => UNI && UNI.rows.find(r => r.c === c);
function searchUni(q, n = 8) {
  q = (q || "").trim().toUpperCase();
  if (!q || !UNI) return [];
  const a = [], b = [], c = [];
  for (const r of UNI.rows) {
    if (r.c === q) a.push(r); else if (r.c.startsWith(q)) b.push(r); else if ((r.n || "").toUpperCase().includes(q)) c.push(r);
  }
  return [...a, ...b, ...c].slice(0, n);
}
function attachSearch(inp, box, onPick) {
  const pick = c => { inp.value = c; box.classList.add("hide"); onPick(c); };
  const paint = () => {
    const res = searchUni(inp.value);
    box.innerHTML = res.map(r => `<button type="button" class="sug" data-sug="${r.c}"><b>${r.c}</b><span class="grow nm">${esc(r.n)}</span><span class="mono">${fmt(r.p)}</span></button>`).join("");
    box.classList.toggle("hide", !res.length);
  };
  inp.addEventListener("input", paint);
  inp.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const r = searchUni(inp.value, 1)[0];
    if (r) pick(r.c); else if (inp.value.trim()) pick(inp.value.trim().toUpperCase());
  });
  box.addEventListener("click", e => { const b = e.target.closest("[data-sug]"); if (b) pick(b.dataset.sug); });
}

  else if (px >= bo) pos = "sudah di atas level tembus";

  else if (sz && px >= sz[0]) pos = "harga di area jual";

    <p class="muted">Level menunjukkan di mana keputusan perlu diambil, bukan jaminan arah. Selalu tunggu harga ditutup melewati level.</p>
    <button class="btn ghost full" data-close>Tutup</button>`);
  drawChart(a);
}

// OHLC disimpan per kolom ({t,o,h,l,c,v}) agar file kecil; format lama (larik objek) tetap didukung
function bars(a) {
  const o = a.ohlc;
  if (Array.isArray(o)) return o;
  return o.t.map((t, i) => ({time: t, open: o.o[i], high: o.h[i], low: o.l[i], close: o.c[i], volume: o.v[i]}));
}
function drawChart(a) {
  const B = bars(a);
  const el = $("#lwc");
  if (!window.LightweightCharts) { el.innerHTML = `<div class="empty">Chart gagal dimuat.</div>`; return; }
  if (lwChart) { try { lwChart.remove(); } catch {} lwChart = null; }
  const LC = window.LightweightCharts;
  lwChart = LC.createChart(el, {autoSize: true, layout: {background: {color: "#161d24"}, textColor: "#8a97a6"},
    grid: {vertLines: {color: "#1f2830"}, horzLines: {color: "#1f2830"}}, rightPriceScale: {borderColor: "#26303b"},
    timeScale: {borderColor: "#26303b"}, crosshair: {mode: 0}, localization: {locale: "id-ID"}});
  const c = lwChart.addCandlestickSeries({upColor: "#22c27b", downColor: "#f25551", borderVisible: false, wickUpColor: "#22c27b", wickDownColor: "#f25551",
    priceFormat: {type: "price", precision: 0, minMove: 1}});
  c.setData(B.map(d => ({time: d.time, open: d.open, high: d.high, low: d.low, close: d.close})));
  const v = lwChart.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: "", color: "#2a3542"});
  v.priceScale().applyOptions({scaleMargins: {top: .82, bottom: 0}});
  v.setData(B.map(d => ({time: d.time, value: d.volume, color: d.close >= d.open ? "rgba(34,194,123,.35)" : "rgba(242,85,81,.35)"})));
  const L = a.levels, line = (p, color, title, style) => c.createPriceLine({price: p, color, lineWidth: 2, lineStyle: style, axisLabelVisible: true, title});
  // area beli = [jebol, batas atas]; area jual = [batas bawah, tembus] -> tiap level digambar sekali
  if (L.buy_zone && L.buy_zone[1] !== L.breakdown.level) line(L.buy_zone[1], "#22c27b", "Area beli", 0);
  if (L.sell_zone && L.sell_zone[0] !== L.breakout.level) line(L.sell_zone[0], "#f25551", "Area jual", 0);
  line(L.breakout.level, "#5aa2ff", "Tembus ↑", 2);
  line(L.breakdown.level, "#ff8a3d", "Jebol ↓", 2);
  const n = B.length;
  // penanda berita di chart (tanggal terbit; berita setelah 16.00 ditempel ke hari bursa berikutnya)
  const times = B.map(d => d.time), marks = {};
  (a.news || []).forEach(it => {
    const dt = new Date(it.published), day = it.published.slice(0, 10), late = dt.getUTCHours() + 7 >= 16;
    const t = times.find(x => late ? x > day : x >= day);
    if (!t) return;
    const m = marks[t] = marks[t] || {n: 0, pos: 0, neg: 0}; m.n++; if (it.tone === "positif") m.pos++; if (it.tone === "negatif") m.neg++;
  });
  c.setMarkers(Object.entries(marks).sort().map(([t, m]) => ({time: t, position: "aboveBar", shape: "circle",
    color: m.pos > m.neg ? "#22c27b" : m.neg > m.pos ? "#f25551" : "#8a97a6", text: m.n > 1 ? String(m.n) : ""})));
  lwChart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - 120), to: n + 3});
}

let STREAM = null, streamCode = "", streamFilter = "ALL", hideRoutine = store.get("hideRoutine", true);
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  return m < 60 ? `${m} mnt lalu` : m < 1440 ? `${Math.round(m / 60)} jam lalu` : `${Math.round(m / 1440)} hari lalu`;
}
function newsItem(it) {
  const r = it.reaction;

  return `<div class="news">
    <div class="meta"><span class="dot2 tone-${it.tone}" title="${it.tone}"></span><b style="color:var(--text)">${esc(it.code)}</b>
      <span class="tag ${it.official ? "t-blue" : "t-gray"}">${esc(it.kind)}</span>${it.official ? `<span class="tag t-blue">Resmi BEI</span>` : ""}

  </div>`;
}
const dmy = iso => { const d = new Date(iso); return d.toLocaleDateString("id-ID", {day: "numeric", month: "short", timeZone: "Asia/Jakarta"}) + " " + d.toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jakarta"}); };
// ringkasan satu peristiwa (gabungan beberapa berita) disusun dari data, bukan isi artikel
function storyItem(s) {
  const r = s.reaction, toneTxt = {positif: "cenderung positif", negatif: "cenderung negatif", netral: "netral"}[s.tone];
  const parts = [s.n > 1 ? `Diberitakan ${s.n}× oleh ${s.sources} media sejak ${dmy(s.first)}, nada ${toneTxt}.`
    : `Diberitakan ${esc(s.heads[0].source || "1 media")} pada ${dmy(s.first)}, nada ${toneTxt}.`];
  if (s.facts && s.facts.length) parts.push(`Angka di judul: ${s.facts.map(esc).join(", ")}.`);
  if (r) parts.push(`Harga <span class="${cls(r.move_pct)}">${pct(r.move_pct)}</span> sejak berita${s.n > 1 ? " pertama" : ""}${r.vol_ratio ? `, volume tertinggi ${fmt1(r.vol_ratio)}× rata-rata` : ""}.`);
  return `<div class="news">
    <div class="meta"><span class="dot2 tone-${s.tone}" title="${s.tone}"></span><b style="color:var(--text)">${esc(s.code)}</b>
      <span class="tag ${s.official ? "t-blue" : "t-gray"}">${esc(s.kind)}${s.detail ? " · " + esc(s.detail) : ""}</span>${s.official ? `<span class="tag t-blue">Resmi BEI</span>` : ""}
      <span>${ago(s.last)}</span></div>
    <div style="font-size:14px;line-height:1.45;margin:4px 0">${parts.join(" ")}</div>
    ${r && r.priced_in ? `<div class="meta"><span class="flag">Sudah dihargai — jangan kejar${ti("priced")}</span></div>` : ""}
    <details class="more" style="margin-top:4px"><summary class="muted" style="font-size:12.5px;font-weight:500">${s.n > 1 ? `Lihat ${s.n} judul berita` : "Lihat judul berita"}</summary>
      ${s.heads.map(x => `<div style="margin:6px 0"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>
        <div class="muted" style="font-size:12px">${esc(x.source || "")} · ${dmy(x.published)}</div></div>`).join("")}</details>
  </div>`;
}

      <p class="muted" style="font-size:12.5px">Ringkasan disusun otomatis dari judul, jumlah media, dan reaksi harga — bukan dari isi artikel. Buka judul untuk membaca beritanya.</p>`
      : `<div class="empty">Tidak ada berita${streamCode ? " " + streamCode : ""} dengan filter ini dalam 7 hari terakhir.</div>`}
    <div class="h">Reaksi harga per jenis peristiwa</div>

      : `<div class="card muted">Statistik muncul setelah tiap jenis peristiwa punya minimal ${STREAM.min_n} kejadian yang sudah lewat 5 hari bursa. Terkumpul: ${collecting} kejadian dari ${STREAM.archive_size} berita di arsip.</div>`}

function startTour(i = 0) {
  $$(".tour-hl,.tour-box").forEach(e => e.remove());
  let step = TOUR[i];
  while (step && (!$(step.sel) || !$(step.sel).getBoundingClientRect().height)) step = TOUR[++i];
  if (!step) { store.set("tourDone", true); return; }
  const el = $(step.sel);
  el.scrollIntoView({block: "center"});
  setTimeout(() => {
    const r = el.getBoundingClientRect(), pad = 6;
    const hl = document.createElement("div"); hl.className = "tour-hl";
    Object.assign(hl.style, {left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: Math.min(r.height, innerHeight * .5) + pad * 2 + "px"});
    const box = document.createElement("div"); box.className = "tour-box";
    const below = r.top + Math.min(r.height, innerHeight * .5) + 180 < innerHeight;
    box.style.top = below ? Math.min(r.top + Math.min(r.height, innerHeight * .5) + 16, innerHeight - 170) + "px" : "auto";
    box.style.bottom = below ? "auto" : "16px";
    box.innerHTML = `<div class="muted">Langkah ${i + 1} dari ${TOUR.length}</div><p>${step.text}</p>
      <div class="btns" style="margin:0"><button class="btn ghost sm" id="tourSkip">Lewati</button><button class="btn sm" id="tourNext">${i + 1 < TOUR.length ? "Lanjut" : "Selesai"}</button></div>`;
    document.body.append(hl, box);
    $("#tourSkip").onclick = () => { $$(".tour-hl,.tour-box").forEach(e => e.remove()); store.set("tourDone", true); };
    $("#tourNext").onclick = () => startTour(i + 1);
  }, 250);
}

><span class="muted" style="font-size:14px;color:#cdd6df">Cari emiten mana pun, lalu lihat kesimpulan satu baris, chart dengan area beli/jual dan garis tembus/jebol, ringkasan teknikal & fundamental, serta pola dividen. Angka lengkap ada di "Lihat detail". Semua level dihitung dari titik balik harga yang benar-benar terjadi.</span><div class="when">Kapan: sebelum membeli, dan untuk menentukan batas jual saham yang Anda pegang.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="19" cy="12" r="2"/></svg></div><div><b>Stream Peristiwa</b><span class="muted" style="font-size:14px;color:#cdd6df">Berita, keterbukaan informasi BEI, dan kalender peristiwa (dividen, laporan keuangan, RUPS) untuk saham yang dipantau. Setiap berita menunjukkan reaksi harga sejak terbit; yang sudah bergerak ≥5% ditandai "sudah dihargai — jangan kejar".</span><div class="when">Kapan: untuk tahu alasan saham naik/turun, dan menghindari saham dengan peristiwa besar di hari trading.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg></div><div><b>Track Record</b><span class="muted" style="font-size:14px;color:#cdd6df">Bukti nyata: Daftar Pagi disimpan sebelum hari perdagangan, lalu dinilai dengan harga sebenarnya. Menunjukkan apakah dashboard benar-benar menghasilkan di pasar, bukan hanya di simulasi.</span><div class="when">Kapan: cek tiap minggu. Pakai uang sungguhan hanya bila hasilnya positif dalam beberapa minggu.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg></div><div><b>Hari Ini</b><span class="muted" style="font-size:14px;color:#cdd6df">Halaman utama. Satu kesimpulan: boleh trading atau tidak hari ini, plus daftar saham day trade lengkap dengan harga Beli, Stop loss, Take profit, dan jumlah Lot.</span><div class="when">Kapan: Buka setiap pagi sebelum 08.45.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></div><div><b>Posisi Saya</b><span class="muted" style="font-size:14px;color:#cdd6df">Daftar saham yang sedang Anda pegang. Statusnya berubah menjadi JUAL saat harga kena stop loss, mencapai take profit, atau muncul sinyal jual.</span><div class="when">Kapan: Buka saat istirahat dan sebelum 15.45.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div><div><b>Cek Saham</b><span class="muted" style="font-size:14px;color:#cdd6df">Periksa satu saham dari seluruh emiten: layak dibeli atau tidak. Isi harga beli Anda untuk melihat kondisi posisi dan batas jual (cut loss).</span><div class="when">Kapan: Sebelum membeli, atau saat posisi sedang minus.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M8 9h8M8 13h6"/></svg></div><div><b>Jurnal</b><span class="muted" style="font-size:14px;color:#cdd6df">Catatan transaksi yang sudah selesai. Menghitung untung/rugi, win rate, dan menunjukkan kebiasaan yang membuat rugi. Juga dipakai untuk rem rugi mingguan.</span><div class="when">Kapan: Setiap kali selesai menjual saham.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg></div><div><b>Sinyal Watchlist</b><span class="muted" style="font-size:14px;color:#cdd6df">Sinyal BUY/SELL untuk saham pilihan di watchlist, diperbarui saat bursa buka.</span><div class="when">Kapan: Untuk melihat saham besar di luar Daftar Pagi.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg></div><div><b>Radar Swing</b><span class="muted" style="font-size:14px;color:#cdd6df">Saham dengan pola akumulasi sebelum naik, untuk disimpan beberapa hari (swing), bukan day trade.</span><div class="when">Kapan: Jika ingin trading jangka beberapa hari.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg></div><div><b>Hasil Uji Strategi</b><span class="muted" style="font-size:14px;color:#cdd6df">Hasil jika aturan dashboard dijalankan di masa lalu: rata-rata untung/rugi per transaksi dan win rate.</span><div class="when">Kapan: Sebelum memakai uang sungguhan, dan cek ulang tiap minggu.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div><div><b>Pengaturan</b><span class="muted" style="font-size:14px;color:#cdd6df">Isi modal, risiko per transaksi, dan batas rugi mingguan. Semua jumlah lot dihitung dari sini.</span><div class="when">Kapan: Sekali di awal, lalu saat modal berubah.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 013 3v13a2 2 0 00-2-2H2zM22 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/></svg></div><div><b>Panduan Harian</b><span class="muted" style="font-size:14px;color:#cdd6df">Urutan kerja harian dengan Stockbit dan cara cek bandar secara manual.</span><div class="when">Kapan: Saat baru mulai memakai dashboard.</div></div></div></div>
    <div class="card"><b>Arti warna</b>
      <div class="reasons" style="margin-top:8px"><span class="tag t-green">Aman / untung</span><span class="tag t-amber">Hati-hati</span><span class="tag t-red">Stop / rugi</span><span class="tag t-blue">Informasi</span></div>
      <div class="flags"><span class="flag block">⛔ Penanda risiko yang memblokir pembelian</span><span class="flag">⚠ Penanda yang perlu diperhatikan</span></div></div>`;
  $("#tourAgain").onclick = () => { go("today"); setTimeout(startTour, 250); };
}

// ================= chart TradingView =================
function openChart(code) {
  const sym = "IDX:" + code;
  sheet(`<div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">${code}</h2>
      <a class="btn ghost sm" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}" target="_blank" rel="noopener" style="text-decoration:none">Buka di TradingView</a>
      <button class="btn ghost sm" data-close>Tutup</button></div>
    <div id="tvBox" style="height:65vh;border-radius:12px;overflow:hidden"></div>`);
  const box = $("#tvBox");
  box.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';
  const sc = document.createElement("script");
  sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"; sc.async = true;
  sc.innerHTML = JSON.stringify({autosize: true, symbol: sym, interval: "D", timezone: "Asia/Jakarta", theme: "dark", style: "1", locale: "id",
    allow_symbol_change: true, hide_side_toolbar: true, studies: ["Volume@tv-basicstudies"], support_host: "https://www.tradingview.com"});
  box.firstChild.appendChild(sc);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-chart]"); if (b) { e.stopPropagation(); openChart(b.dataset.chart); } });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
paintBell();
setSidebar(isDesk() ? store.get("sbOpen", true) : false);
go("today");
load().then(() => { const hp = location.hash.slice(1); if (hp && TITLES[hp] && hp !== page) go(hp); if (!store.get("tourDone", false)) setTimeout(startTour, 600); });
</script>
