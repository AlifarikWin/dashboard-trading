<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Trading BEI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trading BEI">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 12l4-4 3 3 6-7%22 stroke=%22%231fbf75%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<script src="vendor/lightweight-charts.standalone.production.js" defer></script>
<style>
:root{--bg:#0e1318;--card:#161d24;--card2:#1c242d;--line:#26303b;--text:#e8eef4;--mute:#8a97a6;
  --green:#22c27b;--green-bg:rgba(34,194,123,.13);--red:#f25551;--red-bg:rgba(242,85,81,.13);
  --amber:#e9b440;--amber-bg:rgba(233,180,64,.13);--blue:#5aa2ff;--blue-bg:rgba(90,162,255,.13);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{padding:12px 14px calc(28px + env(safe-area-inset-bottom));transition:margin .2s ease}
/* header */
header{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
header h1{font-size:17px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.dot.on{background:var(--green)}
#mkt{margin-left:auto}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.iconbtn.on{border-color:var(--green);color:var(--green)}
/* sidebar */
.sb{position:fixed;top:0;bottom:0;left:0;width:248px;background:#11171d;border-right:1px solid var(--line);z-index:15;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease}
.sb.open{transform:none}
.sb .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;font-weight:800;font-size:16px}
.sb .grp{font-size:11px;color:var(--mute);letter-spacing:.6px;text-transform:uppercase;padding:14px 18px 6px}
.sb button.it{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:1px 8px;padding:10px 12px;border:0;background:none;border-radius:10px;color:#c4ceda;font-size:14.5px;text-align:left}
.sb button.it svg{width:19px;height:19px;flex:none;opacity:.85}
.sb button.it:hover{background:var(--card)}
.sb button.it.on{background:var(--blue-bg);color:var(--blue)}
.sb .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.sb .scroller{overflow-y:auto;flex:1;padding-bottom:16px}
.sb-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:14}
.menubtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
@media (min-width:900px){
  .sb-bg{display:none!important}
  body.sb-pinned .wrap{margin-left:248px}
  body.sb-pinned .wrap{max-width:none;padding-left:28px;padding-right:28px}
  body.sb-pinned .inner{max-width:760px}
}
.inner{max-width:720px;margin:0 auto}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.h{font-size:13px;color:var(--mute);margin:16px 2px 8px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.mono{font-family:var(--mono)}
.muted{color:var(--mute);font-size:13px}
.up{color:var(--green)}.down{color:var(--red)}.amber{color:var(--amber)}
.hide{display:none!important}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.3px;white-space:nowrap}
.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}
.t-amber{background:var(--amber-bg);color:var(--amber)}.t-blue{background:var(--blue-bg);color:var(--blue)}
.t-gray{background:var(--card2);color:var(--mute)}
.btn{background:var(--blue);border:0;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{padding:7px 11px;font-size:13px;font-weight:500}
.btn.full{width:100%}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;width:100%}
label.f{display:block;font-size:12px;color:var(--mute);margin:0 0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .span{grid-column:1/-1}
/* hero verdict */
.hero{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--line)}
.hero.go{background:linear-gradient(135deg,rgba(34,194,123,.18),rgba(34,194,123,.04));border-color:rgba(34,194,123,.35)}
.hero.stop{background:linear-gradient(135deg,rgba(242,85,81,.18),rgba(242,85,81,.04));border-color:rgba(242,85,81,.35)}
.hero.wait{background:linear-gradient(135deg,rgba(233,180,64,.16),rgba(233,180,64,.03));border-color:rgba(233,180,64,.35)}
.hero .k{font-size:12px;color:var(--mute)}
.hero .v{font-size:22px;font-weight:800;margin:2px 0 6px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
/* status tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.tile .k{font-size:11px;color:var(--mute)}
.tile .v{font-weight:700;font-size:15px;margin-top:2px}
/* stock card */
.stock .top{display:flex;align-items:baseline;gap:8px}
.stock .code{font-weight:800;font-size:17px;letter-spacing:.3px}
.stock .px{margin-left:auto;font-family:var(--mono);font-size:16px}
.stock .chg{font-family:var(--mono);font-size:13px;min-width:58px;text-align:right}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.levels div{background:var(--card2);border-radius:10px;padding:7px 8px}
.levels span{display:block;font-size:11px;color:var(--mute)}
.levels b{font-family:var(--mono);font-size:14px;font-weight:600}
.scorebar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--blue)}
/* list rows */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .code{font-weight:700;min-width:54px}
.li .px{font-family:var(--mono);margin-left:auto}
.li .chg{font-family:var(--mono);font-size:13px;min-width:58px;text-align:right}
.li .chev{color:var(--mute)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;background:none;border:0;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi span{display:block;font-size:12px;color:var(--mute)}
.kpi b{font-family:var(--mono);font-size:18px}
.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{padding:5px 0 5px 24px;position:relative;font-size:14px;color:#cdd6df;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li::before{position:absolute;left:2px;font-weight:800}
.checks .y::before{content:"✓";color:var(--green)}.checks .n::before{content:"✕";color:var(--red)}.checks .p::before{content:"•";color:var(--amber)}
.empty{text-align:center;color:var(--mute);padding:28px 10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{color:var(--mute);font-weight:500;font-size:12px}
.scroll{overflow-x:auto}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 10px}
.sheet p{color:#cdd6df;font-size:14px;margin:8px 0}
.step{display:flex;gap:10px;margin:10px 0;font-size:14px;color:#cdd6df}
.step b.n{background:var(--blue-bg);color:var(--blue);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;flex:none;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24303c;border-radius:12px;padding:10px 14px;font-size:14px;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:30}
.ti{background:none;border:0;color:var(--mute);padding:0 0 0 3px;font-size:12px;line-height:1;cursor:pointer;vertical-align:baseline}
.ti:hover{color:var(--blue)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.flag{font-size:12px;border-radius:8px;padding:4px 8px;background:var(--amber-bg);color:var(--amber)}
.flag.block{background:var(--red-bg);color:var(--red)}
.news{padding:12px 14px;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.news a{color:var(--text);text-decoration:none;font-size:14.5px;line-height:1.4;display:block;margin:4px 0}
.news a:hover{text-decoration:underline}
.news .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.dot2{width:8px;height:8px;border-radius:50%;display:inline-block}
.tone-positif{background:var(--green)}.tone-negatif{background:var(--red)}.tone-netral{background:var(--mute)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 2px 10px}
.toggle input{width:auto}
.tour-hl{position:fixed;z-index:40;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.72),0 0 0 2px var(--blue);pointer-events:none;transition:all .2s}
.tour-box{position:fixed;z-index:41;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tour-box p{margin:6px 0 12px;font-size:14.5px;color:#cdd6df}
.offline{background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.zone{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.zone span{background:var(--card2);border-radius:8px;padding:4px 8px;color:#cdd6df}
.zone b{font-family:var(--mono);font-weight:600}
.lvl{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border-bottom:0}
.lvl .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800}
.lvl .t{font-size:13px;color:var(--mute)}
.lvl .v{font-family:var(--mono);font-size:17px;font-weight:700}
.lvl .d{font-size:13px;color:#cdd6df;margin-top:2px}
.trow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.trow .n{color:var(--mute);font-size:12px}
.trow .val{font-family:var(--mono);font-weight:600;text-align:right;white-space:nowrap}
.good{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
#lwc{height:340px;border-radius:12px;overflow:hidden;background:var(--card)}
@media (max-width:420px){header h1{font-size:16px}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin:8px 2px 0}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.help-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.help-item:last-child{border-bottom:0}
.help-item .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;flex:none}
.help-item .ic svg{width:19px;height:19px}
.help-item b{display:block;margin-bottom:2px}
.help-item .when{font-size:12.5px;color:var(--amber);margin-top:4px}
@media (min-width:600px){.levels b{font-size:15px}}
</style>
</head>
<body>
<aside class="sb" id="sb"><div class="brand"><svg width="22" height="22" viewBox="0 0 16 16"><path d="M1 12l4-4 3 3 6-7" stroke="#22c27b" stroke-width="2" fill="none"/></svg>Trading BEI</div><div class="scroller"><div class="grp">Utama</div><button class="it" data-p="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Hari Ini</span></button><button class="it" data-p="pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg><span>Posisi Saya</span><span class="badge hide" id="posBadge"></span></button><button class="it" data-p="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Cek Saham</span></button><button class="it" data-p="jour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M8 9h8M8 13h6"/></svg><span>Jurnal</span></button><div class="grp">Analisis</div><button class="it" data-p="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M17 4v16"/><rect x="4" y="8" width="6" height="7" rx="1"/><rect x="14" y="6" width="6" height="9" rx="1"/></svg><span>Analisis Saham</span></button><button class="it" data-p="stream"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="19" cy="12" r="2"/></svg><span>Stream Peristiwa</span></button><button class="it" data-p="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg><span>Track Record</span></button><button class="it" data-p="signals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg><span>Sinyal Watchlist</span></button><button class="it" data-p="radar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/></svg><span>Radar Swing</span></button><button class="it" data-p="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Hasil Uji Strategi</span></button><div class="grp">Bantuan</div><button class="it" data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Pengaturan</span></button><button class="it" data-p="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 013 3v13a2 2 0 00-2-2H2zM22 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/></svg><span>Panduan Harian</span></button><button class="it" data-p="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01"/></svg><span>Fungsi Menu</span></button></div></aside><div class="sb-bg hide" id="sbBg"></div>
<div class="wrap"><div class="inner">
  <header>
    <button class="menubtn" id="menuBtn" aria-label="Tampilkan/sembunyikan menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <h1 id="pageTitle">Hari Ini</h1>
    <span class="chip" id="mkt"><span class="dot"></span><span>memuat…</span></span>
    <button class="iconbtn" id="bell" title="Alert bunyi & notifikasi" aria-label="Alert">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
    </button>
  </header>

  <!-- HARI INI -->
  <section id="p-today">
    <div id="hero"></div>
    <div class="tiles" id="tiles"></div>
    <div id="picks"></div>
    <button class="btn ghost full" id="noteBtn" style="margin-top:4px">ⓘ Catatan data</button>
  </section>

  <!-- POSISI -->
  <section id="p-pos" class="hide">
    <div class="row" style="margin-bottom:10px"><span class="grow muted">Saham yang sedang Anda pegang</span><button class="btn sm" id="addPos">+ Tambah</button></div>
    <div id="posList"></div>
  </section>

  <!-- CEK -->
  <section id="p-check" class="hide">
    <div class="card">
      <div class="fgrid">
        <div class="span"><label class="f">Kode saham</label><select id="cTicker"></select></div>
        <div><label class="f">Harga beli (jika sudah punya)</label><input id="cAvg" type="number" inputmode="numeric" placeholder="opsional"></div>
        <div><label class="f">Lot</label><input id="cLots" type="number" inputmode="numeric" placeholder="opsional"></div>
      </div>
      <button class="btn full" id="cGo" style="margin-top:12px">Periksa</button>
    </div>
    <div id="checkOut"></div>
  </section>

  <!-- JURNAL -->
  <section id="p-jour" class="hide">
    <div class="row" style="margin-bottom:10px"><span class="grow muted">Transaksi yang sudah selesai</span><button class="btn sm" id="addJ">+ Catat</button></div>
    <div id="jStats"></div>

<script>
// ================= util =================
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const fmt = n => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("id-ID", {maximumFractionDigits: 0});
const fmt1 = (n, d = 1) => n == null || isNaN(n) ? "—" : Number(n).toLocaleString("id-ID", {minimumFractionDigits: d, maximumFractionDigits: d});
const sign = n => n > 0 ? "+" : "";
const pct = (n, d = 2) => n == null || isNaN(n) ? "—" : sign(n) + fmt1(n, d) + "%";
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";
const rp = n => n == null || isNaN(n) ? "—" : (n < 0 ? "−" : n > 0 ? "+" : "") + "Rp" + fmt(Math.abs(n));
const rpS = n => { if (n == null || isNaN(n)) return "—"; const a = Math.abs(n), s = n < 0 ? "−" : n > 0 ? "+" : "";
  return a >= 1e12 ? s + "Rp" + fmt1(a / 1e12) + " T" : a >= 1e9 ? s + "Rp" + fmt1(a / 1e9) + " M" : a >= 1e6 ? s + "Rp" + fmt1(a / 1e6) + " jt" : s + "Rp" + fmt(a); };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let OFFLINE = false;
async function getJSON(p) {
  const r = await fetch(p + "?t=" + Date.now(), {cache: "no-store"});
  if (!r.ok) throw new Error(p + ": " + r.status);
  if (r.headers.get("X-Offline")) OFFLINE = true; else if (p.includes("meta")) OFFLINE = false;
  return r.json();
}
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(e._h); e._h = setTimeout(() => e.classList.add("hide"), 5000); }
const tickOf = p => p < 200 ? 1 : p < 500 ? 2 : p < 2000 ? 5 : p < 5000 ? 10 : 25;
const roundDown = p => { const t = tickOf(p); const r = Math.floor(p / t) * t, t2 = tickOf(r); return t2 !== t ? Math.floor(r / t2) * t2 : r; };

// ================= glosarium istilah (tombol ⓘ) =================
const GLOSS = {
  ihsg: ["IHSG", "Indeks Harga Saham Gabungan: gambaran arah pasar secara umum. Saat IHSG turun, kebanyakan saham ikut tertekan, jadi dashboard menyarankan tidak membeli."],
  rem: ["Rem rugi", "Batas rugi per minggu (atur di Pengaturan) dan batas harian (jumlah transaksi & jumlah rugi). Jika tercapai, semua saran lot jadi 0 agar Anda berhenti sebelum rugi membesar."],
  uji: ["Uji strategi", "Aturan Daftar Pagi diuji otomatis di data lama lalu dibuktikan di data terbaru yang terpisah. Jika hasilnya merugi setelah fee, dashboard menyarankan tidak trading."],
  skor: ["Skor", "Nilai 0–100 dari: asing net buy, penutupan dekat harga tertinggi, lonjakan volume, tren, dan akumulasi. Bukan peluang naik dalam persen."],
  trigger: ["Beli ≥ (trigger)", "Harga pemicu Auto Buy. Order baru terkirim jika harga menembus angka ini, sehingga saham yang lemah sejak pagi tidak ikut terbeli."],
  sl: ["Stop loss (SL)", "Harga jual otomatis untuk membatasi rugi. Pasang sebagai Auto Sell Stop Loss di Stockbit segera setelah terbeli."],
  tp: ["Take profit (TP)", "Harga jual otomatis untuk mengambil untung."],
  lot: ["Lot", "1 lot = 100 lembar. Jumlah lot dihitung agar rugi saat kena stop loss sekitar 1% modal (atur di Pengaturan), lalu dikurangi bila ada kondisi waspada."],
  buy: ["Area beli", "Zona support terdekat: harga pernah berbalik naik di sini beberapa kali. Dihitung dari titik balik harga sebenarnya."],
  sell: ["Area jual", "Zona resistance terdekat: harga pernah tertahan turun di sini beberapa kali."],
  bo: ["Tembus ↑", "Jika harga DITUTUP di atas level ini dengan volume, peluang lanjut naik lebih besar. Tunggu penutupan, jangan bereaksi saat baru menyentuh."],
  bd: ["Jebol ↓", "Jika harga DITUTUP di bawah level ini, peluang lanjut turun lebih besar. Bagi pemegang saham, ini batas cut loss."],
  rsi: ["RSI 14", "Ukuran kecepatan naik/turun 14 hari (0–100). ≥70 jenuh beli (rawan koreksi), ≤30 jenuh jual."],
  atr: ["ATR", "Rata-rata rentang gerak harian. Dipakai untuk menentukan jarak stop loss yang wajar."],
  ma: ["MA (moving average)", "Rata-rata harga penutupan N hari. Harga di atas MA50 dan MA200 = tren naik."],
  weekly: ["Tren mingguan", "Arah harga di grafik mingguan. Sinyal beli harian yang melawan tren mingguan sering gagal, jadi tidak dijadikan BUY."],
  rs: ["Kekuatan vs IHSG", "Kenaikan saham dikurangi kenaikan IHSG pada periode yang sama. Positif = saham lebih kuat dari pasar."],
  sector: ["Sektor", "Rata-rata kenaikan saham sektor yang sama di watchlist, untuk melihat apakah sektornya sedang diminati."],
  ara: ["ARA / ARB", "Batas kenaikan (ARA) dan penurunan (ARB) harga dalam sehari yang ditetapkan BEI. Order di luar batas ini otomatis ditolak."],
  per: ["PER", "Harga dibagi laba per saham. Makin kecil, makin murah dibanding labanya (bandingkan dengan saham sejenis)."],
  pbv: ["PBV", "Harga dibagi nilai buku per saham. Di bawah 1 berarti harga di bawah nilai buku."],
  roe: ["ROE", "Laba bersih dibagi ekuitas: seberapa efisien perusahaan menghasilkan laba dari modal pemegang saham."],
  der: ["DER", "Utang dibagi ekuitas. Makin tinggi, makin besar risiko keuangannya (kecuali bank, yang memang berutang tinggi)."],
  graham: ["Nilai wajar Graham", "√(22,5 × EPS × nilai buku per saham). Rumus klasik untuk perkiraan kasar nilai wajar, bukan target harga."],
  winrate: ["Win rate", "Persentase transaksi yang untung setelah fee. Harus dibaca bersama besar untung rata-rata vs rugi rata-rata."],
  priced: ["Sudah dihargai pasar", "Harga sudah bergerak ≥5% sejak berita terbit. Membeli setelah lonjakan karena berita sering berakhir di pucuk (FOMO)."],
  track: ["Track record", "Daftar Pagi disimpan sebelum hari perdagangan, lalu dinilai dengan harga sebenarnya hari itu. Ini bukti nyata, bukan simulasi masa lalu."],
};
const ti = k => GLOSS[k] ? `<button class="ti" data-term="${k}" aria-label="Penjelasan ${GLOSS[k][0]}">ⓘ</button>` : "";
document.addEventListener("click", e => {
  const b = e.target.closest("[data-term]"); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  const [t, d] = GLOSS[b.dataset.term];
  sheet(`<h2>${t}</h2><p>${d}</p><button class="btn ghost full" data-close>Mengerti</button>`);
}, true);
const TECH_TERM = l => /^RSI/.test(l) ? "rsi" : /ATR|Volatil/.test(l) ? "atr" : /mingguan/.test(l) ? "weekly" : /IHSG/.test(l) ? "rs" : /^Sektor/.test(l) ? "sector"
  : /^MA|Jarak dari MA/.test(l) ? "ma" : /^PER/.test(l) ? "per" : /^PBV/.test(l) ? "pbv" : /^ROE/.test(l) ? "roe" : /DER/.test(l) ? "der" : /Graham/.test(l) ? "graham" : null;

// ================= state =================
let SIG = null, META = null, DT = null, CHECK = null, BT = null;
let alertsOn = store.get("alertsOn", false), prevSig = store.get("prevSignals", {}), alerted = new Set(store.get("posAlerted", []));
let nextAt = 0, timer = null, audio = null;

// ================= sheet =================
function sheet(html) { $("#sheet").innerHTML = `<div class="grab"></div>` + html; $("#sheetBg").classList.remove("hide"); document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheetBg").classList.add("hide"); $("#sheet").innerHTML = ""; document.body.style.overflow = ""; }
$("#sheetBg").onclick = e => { if (e.target.id === "sheetBg" || e.target.closest("[data-close]")) closeSheet(); };

// ================= navigasi (sidebar) =================
const TITLES = {stream: "Stream Peristiwa", track: "Track Record", analysis: "Analisis Saham", today: "Hari Ini", pos: "Posisi Saya", check: "Cek Saham", jour: "Jurnal", signals: "Sinyal Watchlist",
  radar: "Radar Swing", bt: "Hasil Uji Strategi", set: "Pengaturan", guide: "Panduan Harian", help: "Fungsi Menu"};
const SUB = {stream: () => renderStream(), track: () => renderTrack(), analysis: () => renderAnalysis(), signals: () => renderSignals(), radar: () => renderRadar(), bt: () => renderBT(), set: () => renderSettings(), guide: () => renderGuide(), help: () => renderHelp()};
let page = "today";
const isDesk = () => window.matchMedia("(min-width:900px)").matches;
function setSidebar(open) {
  $("#sb").classList.toggle("open", open);
  $("#sbBg").classList.toggle("hide", !open || isDesk());
  document.body.classList.toggle("sb-pinned", open && isDesk());
  if (isDesk()) store.set("sbOpen", open);
}
$("#menuBtn").onclick = () => setSidebar(!$("#sb").classList.contains("open"));
$("#sbBg").onclick = () => setSidebar(false);
window.addEventListener("resize", () => setSidebar(isDesk() ? store.get("sbOpen", true) : false));
function go(p) {

  $$(".sb .it").forEach(b => b.classList.toggle("on", b.dataset.p === p));
  $("#pageTitle").textContent = TITLES[p];
  const core = ["today", "pos", "check", "jour"].includes(p);

}
$$(".sb .it").forEach(b => b.onclick = () => go(b.dataset.p));
let anTicker = null;
function openAnalysis(t) { anTicker = t; closeSheet(); go("analysis"); }
document.addEventListener("click", e => { const b = e.target.closest("[data-an]"); if (b) { e.stopPropagation(); openAnalysis(b.dataset.an); } });
function openSub(k) { go(k); }

// ================= pengaturan & risiko =================
function settings() {
  const r = (META && META.risk) || {capital_idr: 1e7, risk_per_trade_pct: 1, max_position_pct: 25, fee_buy_pct: .15, fee_sell_pct: .25};
  const s = store.get("settings", {});
  return {cap: s.cap ?? r.capital_idr, risk: s.risk ?? r.risk_per_trade_pct, maxPos: s.maxPos ?? r.max_position_pct, week: s.week ?? 3,
    maxTrades: s.maxTrades ?? 3, maxLoss: s.maxLoss ?? 2, feeB: r.fee_buy_pct, feeS: r.fee_sell_pct};
}
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function daily() {  // batas harian: jumlah transaksi & rugi hari ini
  const s = settings(), t = todayStr();
  const opened = getPos().filter(p => (p.at || "").slice(0, 10) === t).length
    + getJ().filter(j => (j.openedAt || "").slice(0, 10) === t).length;
  const closedToday = getJ().filter(j => j.date === t);
  const losses = closedToday.filter(j => tradePL(j) < 0).length;
  const why = [];
  if (opened >= s.maxTrades) why.push(`sudah ${opened} transaksi hari ini (maks ${s.maxTrades})`);
  if (losses >= s.maxLoss) why.push(`sudah ${losses}× rugi hari ini (maks ${s.maxLoss})`);
  return {opened, losses, stop: why.length > 0, why};
}
const regime = () => (DT && DT.regime) || (SIG && SIG.regime) || {level: "unknown", status: "—"};
function lots(p, maxShare) {
  const s = settings(), lim = p.limit, sl = p.sl, per = (lim - sl) + lim * (s.feeB + s.feeS) / 100;
  if (per <= 0) return 0;
  return Math.max(0, Math.min(Math.floor(s.cap * s.risk / 100 / per / 100), Math.floor(s.cap * (maxShare ?? s.maxPos / 100) / (lim * 100))));
}
function adjLots(n) {  // pengaman: rem rugi, kondisi IHSG, hasil uji
  const r = regime(), t = DT && DT.tuning;
  if (brake().stop) return [0, "rem rugi aktif"];
  if (daily().stop) return [0, "batas harian tercapai"];
  if (r.level === "bad") return [0, "IHSG turun"];
  if (t && t.status === "tidak_layak") return [0, "uji strategi negatif"];
  let why = [];
  if (r.level === "warn") { n = Math.floor(n / 2); why.push("IHSG waspada"); }
  if (t && t.status === "data_kurang") { n = Math.floor(n / 2); why.push("uji belum cukup"); }
  return [n, why.join(", ")];
}

// ================= jurnal & rem rugi =================
const getJ = () => store.get("journal", []);
const tradePL = t => { const s = settings(); return (t.sell * (1 - s.feeS / 100) - t.buy * (1 + s.feeB / 100)) * t.lots * 100; };
function brake() {
  const s = settings(), d = new Date(), ws = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
  const pl = getJ().filter(t => new Date(t.date + "T00:00:00") >= ws).reduce((a, t) => a + tradePL(t), 0);
  const limit = s.cap * s.week / 100;
  return {pl, limit, stop: pl <= -limit};
}

// ================= posisi =================
const getPos = () => store.get("positions", []), setPos = v => store.set("positions", v);
function priceOf(code) {
  const s = SIG && SIG.signals.find(x => x.ticker === code);
  if (s) return {price: s.price, sig: s, zones: s.zones};
  const p = DT && DT.picks.find(x => x.code === code);
  if (p) return {price: p.live ? p.live.last : p.close, sig: null, zones: p.zones};
  const c = CHECK && CHECK.stocks[code];
  return c ? {price: c.price, sig: c.signal, zones: c.zones} : null;
}
function posStatus(p) {
  const q = priceOf(p.ticker);
  if (!q) return {label: "—", tag: "t-gray", note: "harga tidak tersedia", price: null};
  if (q.price <= p.sl) return {label: "JUAL", tag: "t-red", note: "kena stop loss", price: q.price};
  if (q.price >= p.tp) return {label: "JUAL", tag: "t-green", note: "take profit tercapai", price: q.price};
  if (q.sig && q.sig.signal === "SELL") return {label: "JUAL", tag: "t-red", note: (q.sig.reasons || [])[0] || "sinyal SELL", price: q.price};
  return {label: "TAHAN", tag: "t-blue", note: "di antara SL dan TP", price: q.price};
}

// ================= alert =================
function beep() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = 880; g.gain.setValueAtTime(.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .5);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .5); } catch {} }
function alertMsg(t) { toast(t); if (!alertsOn) return; beep();
  try { if ("Notification" in window && Notification.permission === "granted") new Notification("Trading BEI", {body: t}); } catch {} }
function paintBell() { $("#bell").classList.toggle("on", alertsOn); }
$("#bell").onclick = async () => {
  alertsOn = !alertsOn; store.set("alertsOn", alertsOn); paintBell();
  toast(alertsOn ? "Alert aktif selama halaman ini terbuka" : "Alert dimatikan");
  if (alertsOn) { beep(); try { if ("Notification" in window && Notification.permission === "default") await Notification.requestPermission(); } catch {} }
};
function detectChanges() {
  if (!SIG) return;
  const now = {}, news = [];
  SIG.signals.forEach(s => { now[s.ticker] = s.signal; if ((s.signal === "BUY" || s.signal === "SELL") && prevSig[s.ticker] && prevSig[s.ticker] !== s.signal) news.push(`${s.signal} ${s.ticker}`); });
  if (news.length) alertMsg("Sinyal baru: " + news.join(", "));
  prevSig = now; store.set("prevSignals", now);
  const day = (META && META.generated_at || "").slice(0, 10), msgs = [];
  getPos().forEach(p => { const st = posStatus(p), k = `${p.ticker}|${st.note}|${day}`;
    if (st.label === "JUAL" && !alerted.has(k)) { msgs.push(`${p.ticker}: ${st.note}`); alerted.add(k); } });
  store.set("posAlerted", [...alerted].slice(-100));
  if (msgs.length) alertMsg("Jual sekarang — " + msgs.join("; "));
}
setInterval(() => {  // alarm tutup posisi day trade
  const n = new Date(), hm = n.getHours() * 60 + n.getMinutes(), k = "closeAlarm-" + n.toISOString().slice(0, 10);
  if (n.getDay() >= 1 && n.getDay() <= 5 && hm >= 900 && hm < 946 && getPos().length && !store.get(k, false)) {
    store.set(k, true); alertMsg(`Tutup ${getPos().length} posisi day trade sebelum 15.45: ${getPos().map(p => p.ticker).join(", ")}`);
  }
}, 30000);

// ================= muat data =================
async function load() {

    $("#offline") && $("#offline").remove();
    if (OFFLINE) $("#p-today").insertAdjacentHTML("afterbegin", `<div class="offline" id="offline">Mode offline: menampilkan data terakhir yang tersimpan (${esc(META.generated_at)}).</div>`);

}
function schedule(sec) { nextAt = Date.now() + sec * 1000; clearTimeout(timer); timer = setTimeout(load, sec * 1000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() > nextAt - 5000) load(); });

function renderAll() {

// ================= HARI INI =================
function renderToday() {
  const d = DT, r = regime(), t = d.tuning, br = brake(), dl = daily();
  const stops = [], warns = [];
  if (br.stop) stops.push("Batas rugi minggu ini tercapai");
  if (dl.stop) stops.push("Batas harian tercapai");
  (d.stops || []).forEach(x => stops.push(x));
  if (r.level === "warn") warns.push("IHSG waspada — lot ½");
  if (t && t.status === "data_kurang") warns.push("Uji belum cukup — lot ½");

  let hero;
  if (stops.length) hero = `<div class="hero stop"><div class="k">${when}</div><div class="v">Jangan trading</div>
      <div class="reasons">${stops.map(x => `<span class="tag t-red">${esc(x)}</span>`).join("")}</div></div>`;
  else hero = `<div class="hero ${warns.length ? "wait" : "go"}"><div class="k">${when}</div><div class="v">${d.picks.length} saham siap dipasang</div>
      <div class="reasons">${warns.map(x => `<span class="tag t-amber">${esc(x)}</span>`).join("") || `<span class="tag t-green">Semua syarat terpenuhi</span>`}</div></div>`;
  $("#hero").innerHTML = hero;

  const rl = {ok: ["SEHAT", "up"], warn: ["WASPADA", "amber"], bad: ["TURUN", "down"]}[r.level] || ["—", ""];
  const tl = !t ? ["—", ""] : t.status === "layak" ? ["LAYAK", "up"] : t.status === "tidak_layak" ? ["MERUGI", "down"] : ["KURANG DATA", "amber"];
  $("#tiles").innerHTML = `
    <button class="tile" data-info="ihsg"><div class="k">IHSG</div><div class="v ${rl[1]}">${rl[0]}</div></button>
    <button class="tile" data-info="rem"><div class="k">Rem rugi</div><div class="v ${br.stop || dl.stop ? "down" : "up"}">${br.stop || dl.stop ? "BERHENTI" : "AMAN"}</div></button>
    <button class="tile" data-info="uji"><div class="k">Uji strategi</div><div class="v ${tl[1]}">${tl[0]}</div></button>`;
  $$("[data-info]").forEach(b => b.onclick = () => infoSheet(b.dataset.info));

  const stopTrading = stops.length > 0;
  if (!d.picks.length) $("#picks").innerHTML = "";
  else if (stopTrading) $("#picks").innerHTML = `<div class="h">Dipantau saja · jangan dibeli</div><div class="list">` + d.picks.map(x => {
      const lv = x.live, st = lv ? lv.status : "";
      return `<button class="li" data-how="${x.code}"><span class="code">${x.code}</span><span class="muted grow">${esc(st)}</span>
        <span class="px">${fmt(lv ? lv.last : x.close)}</span><span class="chg ${cls(x.chg_pct)}">${pct(x.chg_pct)}</span><span class="chev">›</span></button>`; }).join("") + `</div>`;
  else $("#picks").innerHTML = `<div class="h">Daftar pagi</div>` + d.picks.map(x => pickCard(x)).join("");
  $$("[data-how]").forEach(b => b.onclick = () => howSheet(b.dataset.how));
  $$("[data-bought]").forEach(b => b.onclick = () => posForm(boughtPrefill(b.dataset.bought)));

  const notes = [...(META.errors || [])];
  const age = dataAgeMin();
  if (age > 40 && META.market.status === "buka") notes.unshift(`Data terakhir ${age} menit lalu (jadwal GitHub terlambat).`);

function gateCheck(p) {
  // aturan yang harus dipenuhi sebelum mencatat pembelian
  const v = [], r = regime(), br = brake(), dl = daily();
  const pick = DT && DT.picks.find(x => x.code === p.ticker);
  const sig = SIG && SIG.signals.find(x => x.ticker === p.ticker);
  const fl = (pick && pick.flags) || (sig && sig.flags) || [];
  if (!(p.sl > 0 && p.sl < p.avg)) v.push("Stop loss belum diisi atau tidak di bawah harga beli");
  if (!(p.tp > p.avg)) v.push("Take profit tidak di atas harga beli");
  if (br.stop) v.push("Rem rugi mingguan sedang aktif");
  if (dl.stop) v.push("Batas harian tercapai: " + dl.why.join(", "));
  if (r.level === "bad") v.push("IHSG sedang turun");
  if (fl.some(f => f.block)) v.push("Saham punya penanda risiko BEI: " + fl.filter(f => f.block).map(f => f.text).join("; "));
  if (pick) {
    const sug = adjLots(lots(pick.plan, .5))[0];
    if (sug > 0 && p.lots > sug) v.push(`Lot ${p.lots} melebihi saran ${sug} lot`);
    if (DT.stops && DT.stops.length) v.push("Dashboard menyarankan tidak trading: " + DT.stops.join(", "));
  } else if (!sig || sig.signal !== "BUY") {
    v.push("Saham ini tidak ada di Daftar Pagi dan tidak sedang sinyal BUY");
  }
  if (p.sl > 0 && p.avg > 0 && (p.avg - p.sl) / p.avg > 0.08) v.push("Jarak stop loss lebih dari 8%");
  return v;
}

function renderJournal() {
  const all = getJ();
  if (!all.length) { $("#jStats").innerHTML = ""; $("#jList").innerHTML = `<div class="empty">Belum ada transaksi.<br>Catat setiap transaksi yang selesai, termasuk yang rugi.</div>`; return; }
  const pls = all.map(tradePL), w = pls.filter(x => x > 0), l = pls.filter(x => x <= 0);
  const aw = w.length ? w.reduce((a, b) => a + b, 0) / w.length : 0, al = l.length ? l.reduce((a, b) => a + b, 0) / l.length : 0;
  const total = pls.reduce((a, b) => a + b, 0);
  let tip = "";
  if (l.length >= 2 && Math.abs(al) > aw) tip = "Rugi rata-rata lebih besar dari untung rata-rata. Pasang stop loss di setiap posisi.";
  const byWhy = {}; all.forEach((t, i) => (byWhy[t.why] = byWhy[t.why] || []).push(pls[i]));
  const bad = Object.entries(byWhy).filter(([k, v]) => v.length >= 2 && v.reduce((a, b) => a + b, 0) < 0).map(([k]) => k);
  if (!tip && bad.length) tip = `Alasan masuk "${bad[0]}" terus merugi. Hentikan alasan itu.`;
  // laporan 7 hari terakhir
  const wk = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
  const w7 = all.map((t, i) => ({t, pl: pls[i]})).filter(x => x.t.date >= wk);
  let weekly = "";
  if (w7.length) {
    const tot = w7.reduce((a, x) => a + x.pl, 0), wins = w7.filter(x => x.pl > 0).length;
    const byE = {}; w7.forEach(x => { const k = x.t.emo || "Tidak diisi"; (byE[k] = byE[k] || []).push(x.pl); });
    const rows = Object.entries(byE).map(([k, v]) => ({k, n: v.length, s: v.reduce((a, b) => a + b, 0)})).sort((a, b) => a.s - b.s);
    const vio = w7.filter(x => (x.t.violations || []).length || x.t.emo === "Melanggar aturan").length;
    const worst = rows[0];
    const insight = worst && worst.s < 0 && worst.k !== "Sesuai rencana" ? `Kerugian terbesar minggu ini datang dari transaksi "${worst.k}" (${rp(worst.s)}).`
      : vio ? `${vio} transaksi melanggar aturan minggu ini.` : "Tidak ada pola kesalahan menonjol minggu ini.";
    weekly = `<div class="card"><b>Laporan 7 hari terakhir</b>
      <div class="kpis" style="margin:10px 0 6px"><div class="kpi"><span>Hasil</span><b class="${cls(tot)}">${rp(tot)}</b></div>
        <div class="kpi"><span>Transaksi / menang</span><b>${w7.length} / ${wins}</b></div></div>
      ${rows.map(r => `<div class="trow"><div>${esc(r.k)}<div class="n">${r.n} transaksi</div></div><div class="val ${cls(r.s)}">${rp(r.s)}</div></div>`).join("")}
      <p class="${worst && worst.s < 0 && worst.k !== "Sesuai rencana" ? "amber" : "muted"}" style="margin:8px 0 0;font-size:13.5px">${esc(insight)}</p></div>`;
  }
  $("#jStats").innerHTML = weekly + `<div class="kpis">
      <div class="kpi"><span>Total</span><b class="${cls(total)}">${rp(total)}</b></div>
      <div class="kpi"><span>Win rate${ti("winrate")}</span><b>${fmt1(w.length / pls.length * 100)}%</b></div>
      <div class="kpi"><span>Untung rata-rata</span><b class="up">${rp(aw)}</b></div>
      <div class="kpi"><span>Rugi rata-rata</span><b class="down">${rp(al)}</b></div></div>
    ${tip ? `<div class="card" style="border-color:rgba(233,180,64,.4)"><span class="amber">⚠ ${esc(tip)}</span></div>` : ""}`;
  $("#jList").innerHTML = `<div class="list">` + all.map((t, i) => ({t, i, pl: pls[i]})).reverse().map(({t, i, pl}) => `
    <button class="li" data-j="${i}"><span class="code">${esc(t.ticker)}</span><span class="muted">${t.date.slice(5)}</span>
    <span class="px ${cls(pl)}">${rp(pl)}</span><span class="chev">›</span></button>`).join("") + `</div>`;
  $$("[data-j]").forEach(b => b.onclick = () => { const i = +b.dataset.j, t = getJ()[i];
    sheet(`<h2>${esc(t.ticker)} · ${t.date}</h2><p class="mono">Beli ${fmt(t.buy)} → Jual ${fmt(t.sell)} · ${t.lots} lot</p>
      <p>Hasil bersih: <b class="${cls(tradePL(t))}">${rp(tradePL(t))}</b></p><p class="muted">Alasan masuk: ${esc(t.why)} · Kondisi: ${esc(t.emo || "—")}</p>
      ${(t.violations || []).length ? `<ul class="checks">${t.violations.map(x => `<li class="n">${esc(x)}</li>`).join("")}</ul>` : ""}
      <div class="btns"><button class="btn ghost" data-close>Tutup</button><button class="btn ghost" id="jDel">Hapus</button></div>`);
    $("#jDel").onclick = () => { const a = getJ(); a.splice(i, 1); store.set("journal", a); closeSheet(); renderAll(); }; });

function fillTickers() {

$("#cGo").onclick = async () => {
  const t = $("#cTicker").value, avg = +$("#cAvg").value, l = +$("#cLots").value || 1;
  try {
    if (!CHECK) CHECK = await getJSON("data/check.json");
    const j = CHECK.stocks[t];
    if (!j) throw new Error(`Data ${t} belum tersedia`);
    renderCheck(j, avg ? doctor(j, avg, l) : null);
  } catch (e) { $("#checkOut").innerHTML = `<div class="card down">${esc(e.message)}</div>`; }
};
function doctor(j, avg, l) {
  const s = settings(), fee = (s.feeB + s.feeS) / 100, L = j.levels, px = j.price;
  const c = [L.sup20, L.sup10, L.ma50].filter(x => x && x < px);
  const cl = c.length ? roundDown(Math.max(...c) - tickOf(Math.max(...c))) : roundDown(px - 1.5 * (L.atr || px * .03));
  const status = px < L.ma50 && L.sup20 && px < L.sup20 ? "TREN RUSAK" : (px < L.ma50 || j.signal.signal === "SELL") ? "MELEMAH" : "SEHAT";
  return {avg, lots: l, status, cl, plp: (px / avg - 1 - fee) * 100, pl: Math.round((px * (1 - fee) - avg) * l * 100),
    atCl: Math.round((cl * (1 - fee) - avg) * l * 100), atClP: (cl / avg - 1 - fee) * 100, need: px < avg ? (avg / px / (1 - fee) - 1) * 100 : 0};
}
function renderCheck(j, d) {

    const msg = d.status === "TREN RUSAK" ? "Tren rusak. Menurut aturan, ini kondisi keluar. Jangan average down."
      : d.status === "MELEMAH" ? `Tren melemah. Pasang batas jual di ${fmt(d.cl)} dan patuhi.` : `Tren masih utuh. Batas jual logis di ${fmt(d.cl)}.`;
    h += `<div class="hero ${tone}"><div class="k">Posisi Anda di ${j.ticker}</div><div class="v">${d.status}</div><div style="font-size:14px">${msg}</div></div>
      <div class="kpis">

  h += `${flagsHtml(j.flags)}<div class="hero ${v.startsWith("JANGAN") ? "stop" : lvl}" style="margin-top:8px"><div class="k">${d ? "Tambah / beli baru" : "Beli " + j.ticker + " sekarang?"}</div><div class="v">${v}</div></div>
    <div class="card"><ul class="checks" style="margin:0">${en.checks.map(c => `<li class="${c.ok ? "y" : c.warn ? "p" : "n"}">${esc(c.label)}</li>`).join("")}</ul></div>

// OHLC disimpan per kolom ({t,o,h,l,c,v}) agar file kecil; format lama (larik objek) tetap didukung
function bars(a) {
  const o = a.ohlc;
  if (Array.isArray(o)) return o;
  return o.t.map((t, i) => ({time: t, open: o.o[i], high: o.h[i], low: o.l[i], close: o.c[i], volume: o.v[i]}));
}
function drawChart(a) {
  const B = bars(a);
  const el = $("#lwc");
  if (!window.LightweightCharts) { el.innerHTML = `<div class="empty">Chart gagal dimuat.</div>`; return; }
  if (lwChart) { try { lwChart.remove(); } catch {} lwChart = null; }
  const LC = window.LightweightCharts;
  lwChart = LC.createChart(el, {autoSize: true, layout: {background: {color: "#161d24"}, textColor: "#8a97a6"},
    grid: {vertLines: {color: "#1f2830"}, horzLines: {color: "#1f2830"}}, rightPriceScale: {borderColor: "#26303b"},
    timeScale: {borderColor: "#26303b"}, crosshair: {mode: 0}, localization: {locale: "id-ID"}});
  const c = lwChart.addCandlestickSeries({upColor: "#22c27b", downColor: "#f25551", borderVisible: false, wickUpColor: "#22c27b", wickDownColor: "#f25551",
    priceFormat: {type: "price", precision: 0, minMove: 1}});
  c.setData(B.map(d => ({time: d.time, open: d.open, high: d.high, low: d.low, close: d.close})));
  const v = lwChart.addHistogramSeries({priceFormat: {type: "volume"}, priceScaleId: "", color: "#2a3542"});
  v.priceScale().applyOptions({scaleMargins: {top: .82, bottom: 0}});
  v.setData(B.map(d => ({time: d.time, value: d.volume, color: d.close >= d.open ? "rgba(34,194,123,.35)" : "rgba(242,85,81,.35)"})));
  const L = a.levels, line = (p, color, title, style) => c.createPriceLine({price: p, color, lineWidth: 2, lineStyle: style, axisLabelVisible: true, title});
  // area beli = [jebol, batas atas]; area jual = [batas bawah, tembus] -> tiap level digambar sekali
  if (L.buy_zone && L.buy_zone[1] !== L.breakdown.level) line(L.buy_zone[1], "#22c27b", "Area beli", 0);
  if (L.sell_zone && L.sell_zone[0] !== L.breakout.level) line(L.sell_zone[0], "#f25551", "Area jual", 0);
  line(L.breakout.level, "#5aa2ff", "Tembus ↑", 2);
  line(L.breakdown.level, "#ff8a3d", "Jebol ↓", 2);
  const n = B.length;
  // penanda berita di chart (tanggal terbit; berita setelah 16.00 ditempel ke hari bursa berikutnya)
  const times = B.map(d => d.time), marks = {};
  (a.news || []).forEach(it => {
    const dt = new Date(it.published), day = it.published.slice(0, 10), late = dt.getUTCHours() + 7 >= 16;
    const t = times.find(x => late ? x > day : x >= day);
    if (!t) return;
    const m = marks[t] = marks[t] || {n: 0, pos: 0, neg: 0}; m.n++; if (it.tone === "positif") m.pos++; if (it.tone === "negatif") m.neg++;
  });
  c.setMarkers(Object.entries(marks).sort().map(([t, m]) => ({time: t, position: "aboveBar", shape: "circle",
    color: m.pos > m.neg ? "#22c27b" : m.neg > m.pos ? "#f25551" : "#8a97a6", text: m.n > 1 ? String(m.n) : ""})));
  lwChart.timeScale().setVisibleLogicalRange({from: Math.max(0, n - 120), to: n + 3});
}

function ago(iso) {

}

  </div>`;
}

function startTour(i = 0) {
  $$(".tour-hl,.tour-box").forEach(e => e.remove());
  let step = TOUR[i];
  while (step && (!$(step.sel) || !$(step.sel).getBoundingClientRect().height)) step = TOUR[++i];
  if (!step) { store.set("tourDone", true); return; }
  const el = $(step.sel);
  el.scrollIntoView({block: "center"});
  setTimeout(() => {
    const r = el.getBoundingClientRect(), pad = 6;
    const hl = document.createElement("div"); hl.className = "tour-hl";
    Object.assign(hl.style, {left: r.left - pad + "px", top: r.top - pad + "px", width: r.width + pad * 2 + "px", height: Math.min(r.height, innerHeight * .5) + pad * 2 + "px"});
    const box = document.createElement("div"); box.className = "tour-box";
    const below = r.top + Math.min(r.height, innerHeight * .5) + 180 < innerHeight;
    box.style.top = below ? Math.min(r.top + Math.min(r.height, innerHeight * .5) + 16, innerHeight - 170) + "px" : "auto";
    box.style.bottom = below ? "auto" : "16px";
    box.innerHTML = `<div class="muted">Langkah ${i + 1} dari ${TOUR.length}</div><p>${step.text}</p>
      <div class="btns" style="margin:0"><button class="btn ghost sm" id="tourSkip">Lewati</button><button class="btn sm" id="tourNext">${i + 1 < TOUR.length ? "Lanjut" : "Selesai"}</button></div>`;
    document.body.append(hl, box);
    $("#tourSkip").onclick = () => { $$(".tour-hl,.tour-box").forEach(e => e.remove()); store.set("tourDone", true); };
    $("#tourNext").onclick = () => startTour(i + 1);
  }, 250);
}

><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></div><div><b>Pengaturan</b><span class="muted" style="font-size:14px;color:#cdd6df">Isi modal, risiko per transaksi, dan batas rugi mingguan. Semua jumlah lot dihitung dari sini.</span><div class="when">Kapan: Sekali di awal, lalu saat modal berubah.</div></div></div><div class="help-item"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h7a3 3 0 013 3v13a2 2 0 00-2-2H2zM22 4h-7a3 3 0 00-3 3v13a2 2 0 012-2h8z"/></svg></div><div><b>Panduan Harian</b><span class="muted" style="font-size:14px;color:#cdd6df">Urutan kerja harian dengan Stockbit dan cara cek bandar secara manual.</span><div class="when">Kapan: Saat baru mulai memakai dashboard.</div></div></div></div>
    <div class="card"><b>Arti warna</b>
      <div class="reasons" style="margin-top:8px"><span class="tag t-green">Aman / untung</span><span class="tag t-amber">Hati-hati</span><span class="tag t-red">Stop / rugi</span><span class="tag t-blue">Informasi</span></div>
      <div class="flags"><span class="flag block">⛔ Penanda risiko yang memblokir pembelian</span><span class="flag">⚠ Penanda yang perlu diperhatikan</span></div></div>`;
  $("#tourAgain").onclick = () => { go("today"); setTimeout(startTour, 250); };
}

// ================= chart TradingView =================
function openChart(code) {
  const sym = "IDX:" + code;
  sheet(`<div class="row" style="margin-bottom:8px"><h2 class="grow" style="margin:0">${code}</h2>
      <a class="btn ghost sm" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}" target="_blank" rel="noopener" style="text-decoration:none">Buka di TradingView</a>
      <button class="btn ghost sm" data-close>Tutup</button></div>
    <div id="tvBox" style="height:65vh;border-radius:12px;overflow:hidden"></div>`);
  const box = $("#tvBox");
  box.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';
  const sc = document.createElement("script");
  sc.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"; sc.async = true;
  sc.innerHTML = JSON.stringify({autosize: true, symbol: sym, interval: "D", timezone: "Asia/Jakarta", theme: "dark", style: "1", locale: "id",
    allow_symbol_change: true, hide_side_toolbar: true, studies: ["Volume@tv-basicstudies"], support_host: "https://www.tradingview.com"});
  box.firstChild.appendChild(sc);
}
document.addEventListener("click", e => { const b = e.target.closest("[data-chart]"); if (b) { e.stopPropagation(); openChart(b.dataset.chart); } });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
paintBell();
setSidebar(isDesk() ? store.get("sbOpen", true) : false);
go("today");
load().then(() => { if (!store.get("tourDone", false)) setTimeout(startTour, 600); });
</script>
