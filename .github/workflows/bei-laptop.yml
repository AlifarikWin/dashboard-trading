name: data-bei-laptop

# Berjalan di LAPTOP Anda (GitHub self-hosted runner), karena situs BEI menolak server cloud.
# Jika laptop mati saat jadwal, job menunggu dan langsung berjalan begitu runner online kembali.
on:
  schedule:
    - cron: "52 10 * * 1-5"   # 17.52 WIB Senin–Jumat (setelah data penutupan BEI terbit)
  workflow_dispatch:

permissions:
  contents: write   # menyimpan data BEI ke branch `records`
  actions: write    # memicu workflow dashboard setelah data masuk

concurrency:
  group: bei-laptop
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 40
    defaults:
      run:
        shell: bash   # Windows: memakai Git Bash (terpasang bersama Git for Windows)
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # Python dari laptop (bukan setup-python) dipasang ke virtualenv di folder runner,
      # sehingga tetap berjalan walau runner dipasang sebagai service Windows.
      - name: Siapkan Python
        run: |
          TC=$(cygpath -u "$RUNNER_TOOL_CACHE" 2>/dev/null || echo "$RUNNER_TOOL_CACHE")
          VENV="$TC/dashboard-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PYBIN="$VENV/Scripts/python.exe"; else PYBIN="$VENV/bin/python"; fi
          if [ ! -x "$PYBIN" ]; then
            BASE=""
            # "py" dulu: di Windows, "python3" bisa berupa pintasan Microsoft Store yang bukan Python sungguhan
            # Service Windows tidak membaca PATH milik akun pengguna, jadi lokasi umum juga dicek langsung.
            for c in /c/Python312/python.exe /c/Python313/python.exe /c/Python311/python.exe /c/Python314/python.exe \
                     "/c/Program Files/Python312/python.exe" "/c/Program Files/Python313/python.exe" \
                     "/c/Program Files/Python311/python.exe" "/c/Program Files/Python314/python.exe" \
                     py python python3; do
              if command -v "$c" >/dev/null 2>&1 && "$c" -c "import sys; sys.exit(sys.version_info < (3, 10))" >/dev/null 2>&1; then BASE="$c"; break; fi
            done
            if [ -z "$BASE" ]; then echo "::error::Python 3.10+ tidak ditemukan. Pasang Python untuk semua pengguna (All users) dan centang Add to PATH."; exit 1; fi
            "$BASE" -m venv "$VENV"
          fi
          "$PYBIN" -m pip install -q --upgrade pip
          "$PYBIN" -m pip install -q -r requirements.txt
          echo "PY=$PYBIN" >> "$GITHUB_ENV"
          "$PYBIN" --version

      - name: Ambil penyimpanan permanen
        run: '"$PY" store.py pull store'

      - name: Unduh data resmi BEI
        run: '"$PY" fetch_bei.py --store store'

      - name: Simpan ke penyimpanan permanen
        if: always()
        run: '"$PY" store.py push store "data BEI dari laptop"'

      - name: Perbarui dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$PY" fetch_bei.py --dispatch'

  kabari-jika-gagal:
    needs: fetch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Data BEI laptop gagal" -H "Tags: warning" -H "Click: $RUN_URL" \
              -d "Runner laptop gagal mengambil data BEI. Ketuk untuk melihat log." "https://ntfy.sh/$NTFY_TOPIC"
          fi
