name: data-bei-laptop

# Berjalan di LAPTOP Anda (GitHub self-hosted runner), karena situs BEI menolak server cloud.
# Jika laptop mati saat jadwal, job menunggu dan langsung berjalan begitu runner online kembali.
on:
  schedule:
    - cron: "52 10 * * 1-5"   # 17.52 WIB Senin–Jumat (setelah data penutupan BEI terbit)
  workflow_dispatch:

permissions:
  contents: write   # menyimpan data BEI ke branch `records`
  actions: write    # memicu workflow dashboard setelah data masuk

concurrency:
  group: bei-laptop
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: self-hosted
    timeout-minutes: 90
    defaults:
      run:
        # Windows PowerShell 5.1 selalu ada di Windows; service runner tidak selalu menemukan bash.
        # -ExecutionPolicy Bypass: Windows memblokir skrip .ps1 secara bawaan (hanya berlaku untuk proses ini).
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      # Python laptop dipasang ke virtualenv di folder runner agar tetap jalan sebagai service Windows
      # (service tidak membaca PATH milik akun pengguna).
      - name: Siapkan Python
        run: |
          $ErrorActionPreference = 'Continue'
          $venv = Join-Path $env:RUNNER_TOOL_CACHE 'dashboard-venv'
          $py = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path $py)) {
            $cands = @('C:\Python312\python.exe', 'C:\Python313\python.exe', 'C:\Python311\python.exe', 'C:\Python314\python.exe',
                       "$env:ProgramFiles\Python312\python.exe", "$env:ProgramFiles\Python313\python.exe",
                       "$env:ProgramFiles\Python311\python.exe", "$env:ProgramFiles\Python314\python.exe")
            foreach ($n in 'py', 'python') { $c = Get-Command $n -ErrorAction SilentlyContinue; if ($c) { $cands += $c.Source } }
            $base = $null
            foreach ($c in $cands) {
              if (-not (Test-Path $c)) { continue }
              & $c -c "import sys; sys.exit(sys.version_info < (3, 10))" 2>$null
              if ($LASTEXITCODE -eq 0) { $base = $c; break }
            }
            if (-not $base) { Write-Output '::error::Python 3.10+ tidak ditemukan di laptop.'; exit 1 }
            Write-Output "Membuat virtualenv dari $base"
            & $base -m venv $venv
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          & $py -m pip install -q --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-Content -Path $env:GITHUB_ENV -Value "PY=$py" -Encoding ascii
          & $py --version

      - name: Ambil penyimpanan permanen
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PY store.py pull store
          exit $LASTEXITCODE

      - name: Diagnosis akses BEI
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PY diag_bei.py

      - name: Unduh data resmi BEI
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PY fetch_bei.py --store store
          exit $LASTEXITCODE

      - name: Simpan ke penyimpanan permanen
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PY store.py push store "data BEI dari laptop"
          exit $LASTEXITCODE

      - name: Perbarui dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:PY fetch_bei.py --dispatch
          exit $LASTEXITCODE

  kabari-jika-gagal:
    needs: fetch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Data BEI laptop gagal" -H "Tags: warning" -H "Click: $RUN_URL" \
              -d "Runner laptop gagal mengambil data BEI. Ketuk untuk melihat log." "https://ntfy.sh/$NTFY_TOPIC"
          fi
