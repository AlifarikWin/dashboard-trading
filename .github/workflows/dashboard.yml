name: perbarui-dashboard

on:
  schedule:
    # Waktu cron GitHub memakai UTC (WIB = UTC+7). Menit sengaja tidak bulat: jadwal :00/:15/:30 paling sering ditunda.
    # Untuk jadwal yang lebih andal, picu juga dari cron-job.org (lihat README).
    - cron: "41 23 * * 0-4"           # 06.41 WIB Senin–Jumat: Daftar Pagi + notifikasi pagi
    - cron: "7,22,37,52 2-8 * * 1-5"  # tiap 15 menit, 09.07–15.52 WIB
    - cron: "43 10 * * 1-5"           # 17.43 WIB: data penutupan + backtest swing
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      heavy:
        description: "Sertakan backtest swing & perbarui fundamental (lebih lama)"
        type: boolean
        default: false
      dari:
        description: "Isi 'cron' bila dipicu cron-job.org (di luar jam bursa otomatis dilewati)"
        type: string
        default: manual

permissions:
  contents: write   # menyimpan track record & arsip ke branch `records`
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pemicu dari cron-job.org cukup "tiap 15 menit"; di sini dipilih yang perlu dijalankan:
  # Senin–Jumat 06.30–16.14 WIB (pra-buka & sesi bursa) dan 17.30–17.59 WIB (data penutupan).
  cek-jam:
    runs-on: ubuntu-latest
    outputs:
      jalan: ${{ steps.c.outputs.jalan }}
    steps:
      - id: c
        run: |
          JALAN=true
          if [ "${{ inputs.dari }}" = "cron" ]; then
            D=$(TZ=Asia/Jakarta date +%u); T=$((10#$(TZ=Asia/Jakarta date +%H%M)))
            JALAN=false
            if [ "$D" -le 5 ] && { { [ "$T" -ge 630 ] && [ "$T" -lt 1615 ]; } || { [ "$T" -ge 1730 ] && [ "$T" -lt 1800 ]; }; }; then
              JALAN=true
            fi
          fi
          echo "jalan=$JALAN" >> "$GITHUB_OUTPUT"
          echo "Dijalankan: $JALAN"

  build:
    needs: cek-jam
    if: needs.cek-jam.outputs.jalan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Uji otomatis
        run: python -m pytest -q tests

      - name: Ambil penyimpanan permanen (branch records)
        run: python store.py pull store

      # Analisis harian seluruh emiten (±800 file) disimpan di cache Actions, bukan di git:
      # dihitung ulang sekali per hari bursa, run lain cukup memulihkannya.
      - name: Pulihkan data seluruh emiten
        uses: actions/cache/restore@v4
        with:
          path: cache_all
          key: allstocks-v3-${{ github.run_id }}
          restore-keys: allstocks-v3-

      - name: Hitung data dashboard
        env:
          STORE: store
          ALL_CACHE: cache_all
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          HEAVY=""
          H=$(TZ=Asia/Jakarta date +%H)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.heavy }}" = "true" ] \
             || [ "${{ github.event.schedule }}" = "43 10 * * 1-5" ] || [ "$H" -ge 17 ]; then
            HEAVY="--heavy"
          fi
          python build.py --out site $HEAVY

      - name: Simpan penyimpanan permanen
        if: always()
        run: python store.py push store "data $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"

      - name: Cek data seluruh emiten diperbarui
        id: cu
        run: |
          if [ -f cache_all/.updated ]; then rm cache_all/.updated; echo "save=true" >> "$GITHUB_OUTPUT"; fi

      - name: Simpan data seluruh emiten
        if: steps.cu.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: cache_all
          key: allstocks-v3-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  kabari-jika-gagal:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Dashboard gagal diperbarui" -H "Tags: warning" -H "Priority: high" \
              -H "Click: $RUN_URL" -d "Pembaruan data gagal. Ketuk untuk melihat log." "https://ntfy.sh/$NTFY_TOPIC"
          fi
