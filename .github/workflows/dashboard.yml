name: perbarui-dashboard

on:
  schedule:
    # Waktu cron GitHub memakai UTC (WIB = UTC+7). Jadwal GitHub bisa terlambat beberapa menit.
    - cron: "30 23 * * 0-4"     # 06.30 WIB Senin–Jumat: Daftar Pagi siap sebelum bursa buka
    - cron: "*/15 2-8 * * 1-5"  # tiap 15 menit, 09.00–15.45 WIB: harga, sinyal, status Daftar Pagi
    - cron: "30 10 * * 1-5"     # 17.30 WIB: data penutupan BEI + backtest swing
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pulihkan cache data BEI
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: idx-${{ github.run_id }}
          restore-keys: idx-

      - name: Hitung data dashboard
        run: |
          HEAVY=""
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "30 10 * * 1-5" ]; then
            HEAVY="--heavy"
          fi
          python build.py --out site $HEAVY

      - name: Simpan cache data BEI
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: idx-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
